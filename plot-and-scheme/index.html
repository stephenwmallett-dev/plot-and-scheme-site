<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230a0a0a'/><circle cx='32' cy='32' r='6' fill='%23fafaf7'/><circle cx='48' cy='20' r='3' fill='%23fafaf7'/><circle cx='14' cy='44' r='3' fill='%23fafaf7'/><circle cx='50' cy='46' r='3' fill='%23fafaf7'/><line x1='32' y1='32' x2='48' y2='20' stroke='%23fafaf7' stroke-width='0.8'/><line x1='32' y1='32' x2='14' y2='44' stroke='%23fafaf7' stroke-width='0.8'/><line x1='32' y1='32' x2='50' y2='46' stroke='%23fafaf7' stroke-width='0.8'/></svg>">
<title>Plot&Scheme</title>
<style>
:root {
  --paper: #fafaf7;
  --paper-warm: #f3f1ea;
  --ink: #0a0a0a;
  --ink-soft: #2a2a28;
  --ink-mute: #6b6b66;
  --ink-faint: #aeaea6;
  --line: rgba(10, 10, 10, 0.12);
  --line-strong: rgba(10, 10, 10, 0.35);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: 'Times New Roman', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--safe-top) + 12px) 18px 12px;
  border-bottom: 0.5px solid var(--line);
  background: var(--paper); z-index: 10; flex-shrink: 0;
}
.brand {
  font-size: 20px; font-style: italic; letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 6px;
}
.brand .amp { color: var(--ink-mute); font-weight: 300; font-size: 24px; line-height: 1; font-style: normal; }
.brand .scheme { font-style: normal; font-weight: bold; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #6b6b66;
  margin-left: 6px;
  transition: background 0.3s;
}
.sync-dot.sync-idle { background: #7fb069; }
.sync-dot.sync-syncing { background: #e8b04b; }
.sync-dot.sync-offline { background: #b6b6b0; }
.sync-dot.sync-error { background: #c73c2e; }
.map-name {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-mute); cursor: pointer;
  padding: 6px 10px; border: 0.5px solid var(--line);
  border-radius: 2px; background: transparent;
}
.map-name:hover { color: var(--ink); border-color: var(--line-strong); }

.canvas-wrap {
  flex: 1; position: relative; overflow: hidden;
  cursor: grab; background: var(--paper); touch-action: none;
}
.canvas-wrap.grabbing { cursor: grabbing; }
.canvas-wrap svg {
  display: block; width: 100%; height: 100%;
  user-select: none; -webkit-user-select: none;
}

.status {
  position: absolute; top: 10px; left: 10px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.05em; color: var(--ink-mute);
  background: var(--paper); padding: 6px 10px;
  border: 0.5px solid var(--line); border-radius: 2px;
  pointer-events: none; max-width: calc(100% - 20px);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status .lbl { color: var(--ink-faint); text-transform: uppercase; }
.status .val { color: var(--ink); margin-left: 6px; font-weight: bold; }

/* Floating action buttons (priority + trash) attached to selected node */
.float-actions {
  position: absolute;
  display: flex;
  gap: 6px;
  pointer-events: none; /* container — buttons enable pointer */
  z-index: 5;
  transition: opacity 100ms ease;
}
.float-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--paper);
  border: 0.5px solid var(--line-strong);
  color: var(--ink-soft);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  padding: 0;
  box-shadow: 0 1px 3px rgba(10, 10, 10, 0.08);
}
.float-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.float-btn-danger:hover { background: #c73c2e; border-color: #c73c2e; color: var(--paper); }
.float-btn.priority-on { background: #c73c2e; color: var(--paper); border-color: #c73c2e; }
.float-btn.date-on { background: #c73c2e; color: var(--paper); border-color: #c73c2e; }
.float-btn.done-on { background: #0a0a0a; color: var(--paper); border-color: #0a0a0a; }

/* Multi-select bar shown when marquee selection is active */
.multi-bar {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--paper);
  border: 0.5px solid var(--line-strong);
  border-radius: 2px;
  overflow: hidden;
  z-index: 6;
  box-shadow: 0 1px 4px rgba(10,10,10,0.08);
  max-width: calc(100% - 24px);
}
.multi-count {
  padding: 10px 14px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  border-right: 0.5px solid var(--line);
  white-space: nowrap;
}
.multi-action {
  background: transparent;
  border: none;
  border-right: 0.5px solid var(--line);
  padding: 10px 14px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
}
.multi-action:last-child { border-right: none; }
.multi-action:hover { background: var(--paper-warm); color: var(--ink); }
.multi-action-danger:hover { background: #c73c2e; color: var(--paper); }
.multi-clear { color: var(--ink-mute); }

/* Marquee rectangle being drawn */
.marquee-rect {
  fill: rgba(10, 10, 10, 0.04);
  stroke: var(--ink);
  stroke-width: 0.75;
  stroke-dasharray: 3 3;
}

.zoom-controls {
  position: absolute; top: 10px; right: 10px;
  display: flex; flex-direction: column;
  background: var(--paper); border: 0.5px solid var(--line);
  border-radius: 2px; overflow: hidden;
}
.zoom-controls button {
  width: 36px; height: 36px;
  background: transparent; border: none;
  border-bottom: 0.5px solid var(--line);
  font-size: 18px; color: var(--ink-soft);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.zoom-controls button:last-child { border-bottom: none; }
.zoom-controls button:hover { background: var(--paper-warm); color: var(--ink); }

.toolbar {
  position: absolute; bottom: calc(var(--safe-bot) + 14px);
  left: 50%; transform: translateX(-50%);
  display: flex; background: var(--paper);
  border: 0.5px solid var(--line-strong); border-radius: 2px;
  overflow: hidden; max-width: calc(100% - 24px);
}
.tool {
  background: transparent; border: none;
  border-right: 0.5px solid var(--line);
  padding: 11px 14px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-soft); cursor: pointer; white-space: nowrap;
}
.tool:last-child { border-right: none; }
.tool:hover:not([disabled]) { background: var(--paper-warm); color: var(--ink); }
.tool:active:not([disabled]) { background: var(--ink); color: var(--paper); }
.tool[disabled] { color: var(--ink-faint); cursor: not-allowed; }
.tool .glyph { font-style: italic; font-size: 13px; text-transform: none; letter-spacing: 0; margin-right: 5px; }

.sheet-bg {
  position: fixed; inset: 0; background: rgba(10, 10, 10, 0.4);
  display: flex; align-items: flex-end; justify-content: center; z-index: 100;
}
.sheet {
  background: var(--paper); width: 100%; max-width: 440px;
  border-radius: 2px 2px 0 0;
  padding: 24px 22px calc(var(--safe-bot) + 22px);
  border-top: 0.5px solid var(--line-strong);
}
@media (min-width: 600px) {
  .sheet-bg { align-items: center; }
  .sheet { border-radius: 2px; max-width: 420px; }
}
.sheet h3 {
  font-style: italic; font-weight: normal; font-size: 22px;
  margin: 0 0 4px; letter-spacing: -0.01em; color: var(--ink);
}
.sheet .sub {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 18px;
}
.sheet input {
  width: 100%; background: transparent; border: none;
  border-bottom: 0.5px solid var(--line-strong);
  font-family: 'Times New Roman', Georgia, serif;
  font-size: 17px; padding: 6px 0; color: var(--ink);
  outline: none; margin-bottom: 14px;
  -webkit-appearance: none; border-radius: 0;
}
.sheet input:focus { border-bottom-color: var(--ink); }
.sheet input[type="date"], .sheet input[type="time"] {
  -webkit-appearance: auto;
  appearance: auto;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 15px;
  letter-spacing: 0.02em;
}
.date-row {
  display: flex; gap: 14px;
  margin-bottom: 8px;
}
.date-field { flex: 1; min-width: 0; }
.date-field input {
  margin-bottom: 6px;
}
.date-label {
  display: block;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.sheet-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.sheet-actions-narrow button { flex: 1 1 calc(33% - 6px); min-width: 90px; padding: 11px 8px; font-size: 10px; }
.sheet-actions button {
  flex: 1; min-width: 80px; padding: 12px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  background: transparent; border: 0.5px solid var(--line-strong);
  color: var(--ink); cursor: pointer; border-radius: 2px;
}
.sheet-actions button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sheet-actions button:hover { background: var(--paper-warm); }
.sheet-actions button.primary:hover { background: var(--ink-soft); }

.sheet-tall {
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
.sheet-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
.sheet-head h3 { margin: 0 0 4px; }
.sheet-head .sub { margin-bottom: 0; }
.view-tabs {
  display: flex; gap: 0;
  border: 0.5px solid var(--line-strong);
  border-radius: 2px;
  flex-shrink: 0;
}
.view-tab {
  background: transparent;
  border: none;
  border-right: 0.5px solid var(--line);
  padding: 7px 9px;
  cursor: pointer;
  color: var(--ink-mute);
  display: flex; align-items: center; justify-content: center;
}
.view-tab:last-child { border-right: none; }
.view-tab:hover { background: var(--paper-warm); color: var(--ink); }
.view-tab.active { background: var(--ink); color: var(--paper); }

.switcher-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-height: 0;
}

.map-list {
  display: flex; flex-direction: column;
  margin: 0 -22px 8px;
  border-top: 0.5px solid var(--line);
}
.map-item {
  display: flex; align-items: center; gap: 14px;
  background: transparent; border: none;
  border-bottom: 0.5px solid var(--line);
  padding: 14px 22px;
  cursor: pointer;
  font-family: 'Times New Roman', Georgia, serif;
  font-size: 17px; color: var(--ink);
  text-align: left; width: 100%;
}
.map-item:hover { background: var(--paper-warm); }
.map-item.active { background: var(--paper-warm); }

.map-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0 -2px 8px;
  padding: 2px;
}
.map-card {
  display: flex; flex-direction: column;
  background: var(--paper);
  border: 0.5px solid var(--line-strong);
  border-radius: 2px;
  padding: 0;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  overflow: hidden;
}
.map-card:hover { background: var(--paper-warm); }
.map-card.active { border-width: 2px; border-color: var(--ink); }

.big-picture-card {
  grid-column: 1 / -1;
  background: var(--ink);
}
.big-picture-card:hover { background: #1a1a18; }
.big-picture-card .map-card-name { color: var(--paper); }
.big-picture-card .map-card-count { color: var(--ink-faint); }

.locked-in-card {
  grid-column: 1 / -1;
  background: var(--paper);
  border: 1px solid #c73c2e;
}
.locked-in-card:hover { background: #fff5f3; }
.locked-in-card .map-card-name { color: #c73c2e; font-weight: 600; }
.locked-in-card .map-card-count { color: #c73c2e; }
.li-thumb {
  background: var(--paper) !important;
  border-bottom: 0.5px solid rgba(199, 60, 46, 0.2) !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 12px;
}
.li-thumb-icon { display: flex; }
.li-thumb-label {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #c73c2e;
  font-weight: 600;
}
.li-dot {
  background: #c73c2e !important;
}
.li-item .map-item-name { color: #c73c2e; font-weight: 500; }
.bp-thumb {
  background: var(--ink) !important;
  border-bottom: 0.5px solid rgba(255,255,255,0.1) !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
}
.bp-mini-dots {
  display: flex; gap: 6px;
}
.bp-mini-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.2);
}
.bp-thumb-label {
  font-family: 'Times New Roman', Georgia, serif;
  font-style: italic;
  font-size: 14px;
  color: var(--paper);
  letter-spacing: -0.01em;
}
.bp-dot {
  background: linear-gradient(135deg, #c75a3a, #d4a017, #6b7a3a, #3d6b6e, #6b3a52) !important;
}
.bp-item .map-item-name { display: flex; align-items: baseline; gap: 8px; }
.bp-sub {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* Big-picture toolbar shows everything; add buttons route adds to the source map of the selected node */
.tool-focus { display: none; }
body.big-picture-mode .tool-focus { display: inline-flex; }
body.locked-in-mode .tool-focus { display: inline-flex; }

.tool-icon {
  padding: 11px 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.tool-divider {
  width: 0.5px;
  background: var(--line-strong);
  align-self: stretch;
  margin: 0;
}
.map-card-thumb {
  background: var(--paper-warm);
  height: 90px;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 0.5px solid var(--line);
}
.map-card-meta {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px 2px;
}
.map-card-name {
  font-family: 'Times New Roman', Georgia, serif;
  font-size: 14px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.map-card-count {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
  padding: 0 10px 8px;
}

.map-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 0.5px solid var(--line-strong);
  flex-shrink: 0;
}
.map-item .map-dot { width: 18px; height: 18px; border-width: 1px; }

.map-item-name { flex: 1; }
.map-item-current {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-mute);
}

.color-wheel-wrap {
  display: flex; flex-direction: column; align-items: center;
  margin: 8px 0 18px;
}
.color-wheel-label {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 12px; align-self: flex-start;
}
.color-wheel {
  position: relative;
  width: 200px; height: 200px;
}
.color-wheel .dot {
  position: absolute;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  cursor: pointer; padding: 0;
  transform: translate(-50%, -50%);
  transition: transform 80ms ease, border-color 80ms ease;
}
.color-wheel .dot:hover { transform: translate(-50%, -50%) scale(1.15); }
.color-wheel .dot.selected {
  border: 2.5px solid var(--ink);
  transform: translate(-50%, -50%) scale(1.2);
}
.color-wheel .dot.none {
  background: var(--paper);
  position: absolute;
}
.color-wheel .dot.none::after {
  content: ''; position: absolute;
  top: 50%; left: 15%; right: 15%; height: 1px;
  background: var(--ink-mute);
  transform: rotate(-45deg);
}

.toast {
  position: fixed; bottom: calc(var(--safe-bot) + 80px);
  left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 10px 16px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  border-radius: 2px; z-index: 200;
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span>Plot</span><span class="amp">&</span><span class="scheme">Scheme</span></div>
    <button class="map-name" id="mapName">My orbit</button>
    <span class="sync-dot sync-idle" id="syncDot" title="Sync: idle"></span>
  </header>
  <div class="canvas-wrap" id="wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="world">
        <g id="links"></g>
        <g id="nodes"></g>
      </g>
      <g id="marqueeLayer"></g>
    </svg>
    <div class="float-actions" id="floatActions" style="display:none;">
      <button class="float-btn" id="floatPriority" aria-label="Toggle priority" title="Mark priority">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <polygon points="8,1.5 10,6 14.5,6 11,9 12.5,13.5 8,10.8 3.5,13.5 5,9 1.5,6 6,6"/>
        </svg>
      </button>
      <button class="float-btn" id="floatDate" aria-label="Set due date" title="Set due date">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3.5" width="12" height="10.5" rx="1"/>
          <line x1="2" y1="6.5" x2="14" y2="6.5"/>
          <line x1="5" y1="2" x2="5" y2="5"/>
          <line x1="11" y1="2" x2="11" y2="5"/>
        </svg>
      </button>
      <button class="float-btn" id="floatDone" aria-label="Mark complete" title="Mark complete">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6.25"/>
          <polyline points="5.2,8.2 7.1,10.1 10.9,5.9"/>
        </svg>
      </button>
      <button class="float-btn float-btn-danger" id="floatDelete" aria-label="Delete" title="Delete">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h10M5 4V2.5h6V4M4 4l1 9.5h6L12 4M6.5 6.5v5M9.5 6.5v5"/>
