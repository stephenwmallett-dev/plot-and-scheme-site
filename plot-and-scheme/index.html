<script>
// ============================================================
// Plot&Scheme — bare bones, single file, IndexedDB persistence
// ============================================================

const SVG_NS = 'http://www.w3.org/2000/svg';
const MIN_ZOOM = 0.3, MAX_ZOOM = 3.0, DRAG_THRESHOLD = 4, SAVE_DEBOUNCE_MS = 400;

// Project color palette — 12-step hue wheel, muted to sit on paper.
// Each entry: { fill: project bubble bg, text: project text, todoFill: child todo bg, todoBorder: child todo edge }
function makeWheelEntry(hue) {
  // Muted, paper-friendly: lower saturation, mid lightness for project fill.
  const fill = `hsl(${hue}, 42%, 42%)`;
  const todoFill = `hsl(${hue}, 35%, 92%)`;
  const todoBorder = `hsl(${hue}, 42%, 42%)`;
  return { fill, text: '#fafaf7', todoFill, todoBorder };
}
const WHEEL_HUES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
const COLORS = { none: null };
WHEEL_HUES.forEach(h => { COLORS['h' + h] = makeWheelEntry(h); });
const COLOR_KEYS = ['none', ...WHEEL_HUES.map(h => 'h' + h)];

// Type styling — height is fixed, width grows with the label.
// Short labels render as circles, longer labels as pills.
const TYPE_STYLE = {
  center:  { h: 80, fontSize: 22, padX: 28, font: "italic 22px 'Times New Roman', Georgia, serif" },
  family:  { h: 56, fontSize: 15, padX: 22, font: "500 15px 'Times New Roman', Georgia, serif" },
  project: { h: 60, fontSize: 16, padX: 24, font: "bold 16px 'Times New Roman', Georgia, serif" },
  todo:    { h: 44, fontSize: 12, padX: 18, font: "12px ui-monospace, Menlo, monospace" }
};

// Cached canvas for measuring text width
let _measureCtx = null;
function measureText(text, font) {
  if (!_measureCtx) _measureCtx = document.createElement('canvas').getContext('2d');
  _measureCtx.font = font;
  return _measureCtx.measureText(text).width;
}

// Compute bubble dimensions for a node based on its label
function nodeDims(n) {
  const style = TYPE_STYLE[n.type];
  // Use bold/uppercase metrics when the node has bold flag — otherwise the bubble
  // would clip after toggling. We swap the font to a heavy weight version.
  const label = n.bold ? (n.label || '').toUpperCase() : n.label;
  const font = n.bold
    ? style.font.replace(/^(italic |bold |500 |400 )?/, '900 ')
    : style.font;
  const textW = measureText(label, font);
  const minW = style.h; // never narrower than tall — keeps circles when label is short
  const w = Math.max(minW, Math.ceil(textW) + style.padX * 2);
  return { w, h: style.h, fontSize: style.fontSize, rx: style.h / 2 };
}

// Determine whether `target` is a valid new parent for `dragged`.
// Rules:
//   - Can't drop onto self
//   - Can't drop onto a descendant (would create a cycle)
//   - To-dos can't have children, so they're never valid parents
//   - In Big Picture, must be in the same source map
function isValidReparentTarget(dragged, target) {
  if (!dragged || !target) return false;
  if (dragged.id === target.id) return false;
  if (target.type === 'todo') return false; // to-dos can't be parents
  if (state.bigPicture) {
    if (dragged._sourceMapId !== target._sourceMapId) return false;
  }
  // Walk up from target to root — if dragged is an ancestor, it's a cycle
  let cur = target;
  const visited = new Set();
  while (cur) {
    if (cur.id === dragged.id) return false;
    if (visited.has(cur.id)) break;
    visited.add(cur.id);
    if (!cur.parent) break;
    cur = state.doc.nodes.find(n => n.id === cur.parent);
  }
  return true;
}

// Clear color override on a node and all its descendants in the active doc.
// Used after reparent so the moved subtree inherits the new parent's color.
function clearColorOverridesRecursive(rootId) {
  const set = new Set([rootId]);
  let changed = true;
  while (changed) {
    changed = false;
    state.doc.nodes.forEach(n => {
      if (n.parent && set.has(n.parent) && !set.has(n.id)) {
        set.add(n.id);
        changed = true;
      }
    });
  }
  set.forEach(id => {
    const n = state.doc.nodes.find(x => x.id === id);
    if (n) delete n.color;
  });
}

// Same descendant collection but on an arbitrary map (for big-picture source writes)
function collectDescendantsInMap(map, rootId) {
  const set = new Set([rootId]);
  let changed = true;
  while (changed) {
    changed = false;
    map.nodes.forEach(n => {
      if (n.parent && set.has(n.parent) && !set.has(n.id)) {
        set.add(n.id);
        changed = true;
      }
    });
  }
  return set;
}

// Find which node (if any) the dragged bubble is overlapping with.
// Uses bubble-to-bubble proximity rather than cursor-to-target — feels more natural
// because you're dragging a whole bubble, not a precise cursor point.
function findReparentTarget(dragged, cursorX, cursorY) {
  const SNAP_BUFFER = 30; // bubbles need only get within 30px of each other
  const draggedDim = nodeDims(dragged);
  let best = null;
  let bestDist = Infinity;
  state.doc.nodes.forEach(n => {
    if (!isValidReparentTarget(dragged, n)) return;
    const dim = nodeDims(n);
    // Distance between bubble *centers*, minus their combined "reach"
    // (half-widths if approaching horizontally, half-heights vertically).
    // Use the smaller dimension to stay tolerant for circular shapes.
    const centerDx = Math.abs(dragged.x - n.x);
    const centerDy = Math.abs(dragged.y - n.y);
    const draggedReach = Math.min(draggedDim.w, draggedDim.h) / 2;
    const targetReach = Math.min(dim.w, dim.h) / 2;
    // Edge-to-edge distance approximation: how far apart the bubbles are
    const edgeGap = Math.max(0, Math.hypot(centerDx, centerDy) - draggedReach - targetReach);
    if (edgeGap < SNAP_BUFFER && edgeGap < bestDist) {
      best = n;
      bestDist = edgeGap;
    }
  });
  return best ? best.id : null;
}

let _idc = 0;
function nid() { return 'n_' + Date.now().toString(36) + '_' + (_idc++).toString(36) + Math.random().toString(36).slice(2, 5); }

// ============================================================
// Storage — IndexedDB
// ============================================================
const DB_NAME = 'plot-and-scheme', STORE = 'maps';
const DB_VERSION = 2; // bumped — v0.5 reseeds 5 starter maps
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = req.result;
      // Fresh start on upgrade — wipes the old single-map data.
      if (db.objectStoreNames.contains(STORE)) db.deleteObjectStore(STORE);
      db.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function loadMap(id) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.warn('loadMap', e); return null; }
}
let saveMap = async function(doc) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(doc);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { console.warn('saveMap', e); }
};
let loadAllMaps = async function() {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.warn('loadAllMaps', e); return []; }
};

// ============================================================
// Cloud sync layer
// ============================================================
// Wraps the local IndexedDB storage above.
// Reads pull from cloud (with local fallback if offline).
// Writes go to cloud AND local cache. Failed cloud writes queue for retry.
const CLOUD_ENDPOINT = '/.netlify/functions/maps';
const PASS_KEY = 'ps-pass';
let cloudEnabled = true;
let syncStatus = 'idle'; // 'idle' | 'syncing' | 'offline' | 'error'
const pendingWrites = new Map(); // id -> map object (latest version)

function getPass() {
  try { return localStorage.getItem(PASS_KEY) || ''; } catch { return ''; }
}
function setPass(p) {
  try { localStorage.setItem(PASS_KEY, p); } catch {}
}

async function cloudFetch(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {}, {
    'x-ps-pass': getPass(),
    'content-type': 'application/json'
  });
  const res = await fetch(CLOUD_ENDPOINT + (path || ''), Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    throw new Error('unauthorized');
  }
  if (!res.ok) {
    throw new Error('http ' + res.status);
  }
  return res.json();
}

async function cloudLoadAll() {
  const data = await cloudFetch('', { method: 'GET' });
  return data.maps || [];
}

async function cloudSaveMap(map) {
  return await cloudFetch('', { method: 'POST', body: JSON.stringify(map) });
}

// Public: replace loadAllMaps and saveMap behavior with cloud-first
async function loadAllMapsSynced() {
  try {
    setSyncStatus('syncing');
    const cloud = await cloudLoadAll();
    // Mirror cloud into local IDB so we have a cache
    for (const m of cloud) await saveMapLocal(m);
    setSyncStatus('idle');
    return cloud;
  } catch (e) {
    console.warn('cloud load failed, falling back to local', e);
    if (String(e.message) === 'unauthorized') {
      setSyncStatus('error');
      throw e; // let caller re-prompt for password
    }
    setSyncStatus('offline');
    return await loadAllMapsLocal();
  }
}

async function saveMapLocal(doc) {
  // Direct IDB write, bypassing the reassignable saveMap binding
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(doc);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { console.warn('saveMapLocal', e); }
}

async function loadAllMapsLocal() {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.warn('loadAllMapsLocal', e); return []; }
}

async function saveMapSynced(doc) {
  // Always cache locally so refresh works even offline
  await saveMapLocal(doc);
  // Then try cloud
  try {
    setSyncStatus('syncing');
    await cloudSaveMap(doc);
    pendingWrites.delete(doc.id);
    setSyncStatus('idle');
  } catch (e) {
    console.warn('cloud save failed, queued', e);
    pendingWrites.set(doc.id, doc);
    setSyncStatus('offline');
  }
}

// Retry queued writes when network comes back
async function drainPendingWrites() {
  if (pendingWrites.size === 0) return;
  const entries = Array.from(pendingWrites.values());
  for (const m of entries) {
    try {
      await cloudSaveMap(m);
      pendingWrites.delete(m.id);
    } catch { /* stay queued */ }
  }
  if (pendingWrites.size === 0) setSyncStatus('idle');
}

function setSyncStatus(s) {
  syncStatus = s;
  const el = document.getElementById('syncDot');
  if (!el) return;
  el.className = 'sync-dot sync-' + s;
  el.title = 'Sync: ' + s;
}

window.addEventListener('online', drainPendingWrites);
window.addEventListener('focus', drainPendingWrites);
setInterval(drainPendingWrites, 15000);

// Prompt for password if we don't have one, or if the cloud rejected our current one.
async function ensureCloudAccess() {
  if (getPass()) return true;
  const p = await promptPassword();
  if (!p) return false;
  setPass(p);
  return true;
}

function promptPassword(errorMsg) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `
      <div class="sheet" role="dialog">
        <h3>Sync passcode</h3>
        <div class="sub">${errorMsg || 'enter passcode to sync across your devices'}</div>
        <input type="password" id="passIn" autocomplete="current-password" />
        <div class="sheet-actions">
          <button class="primary" data-action="save">Unlock</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const input = bg.querySelector('#passIn');
    setTimeout(() => input.focus(), 50);
    function close(v) { bg.remove(); resolve(v); }
    bg.querySelector('[data-action="save"]').addEventListener('click', () => {
      close(input.value.trim());
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') close(input.value.trim());
    });
  });
}

// Redirect saveMap and loadAllMaps to the cloud-synced versions.
// Local paths are still available as saveMapLocal / loadAllMapsLocal.
saveMap = saveMapSynced;
loadAllMaps = loadAllMapsSynced;

// ============================================================
// Seed
// ============================================================

// Five starter maps. Family is black (no color = ink). Others use the wheel.
// Hue numbers correspond to entries in COLORS as 'h{hue}'.
const STARTER_MAPS = [
  { id: 'family',      name: 'Family',           color: 'none', label: 'Family' },
  { id: 'launch',      name: 'UP / Awards / LAUNCH', color: 'h210', label: 'UP / LAUNCH' },
  { id: 'screenplays', name: 'Screenplays',      color: 'h300', label: 'Screenplays' },
  { id: 'equipment',   name: 'Equipment',        color: 'h150', label: 'Equipment' },
  { id: 'nancy',       name: 'Nancy Mace',       color: 'h0',   label: 'Nancy Mace' }
];

function seedMap(meta) {
  return {
    id: meta.id,
    name: meta.name,
    color: meta.color,
    updatedAt: Date.now(),
    nodes: [
      { id: 'center', label: meta.label, type: 'center', x: 800, y: 600 }
    ]
  };
}

function seedAllMaps() {
  return STARTER_MAPS.map(seedMap);
}

// ============================================================
// State
// ============================================================
const state = {
  maps: [],          // array of all map docs
  doc: null,         // currently active map (reference into state.maps OR synthetic for big-picture)
  bigPicture: false, // when true, state.doc is a synthetic aggregation of all maps
  lockedIn: false,   // when true, state.doc is a synthetic stack of priority/due nodes
  selectedId: null,
  multiSelected: null,    // Set<id> when marquee selection is active
  marquee: null,          // { startX, startY, x, y } during draw
  zoom: 1, panX: 0, panY: 0,
  drag: null, pinch: null,
  saveTimer: null,
  lastTap: null           // { id, t } for double-tap detection
};

// In big-picture mode each synthetic node has _sourceMapId and _sourceId.
// We never mutate the synthetic node's x/y as truth — drag deltas write through
// to the source node (subtracting the cluster offset).
const ALL_MAP_ID = '__all__';
const LOCKED_MAP_ID = '__locked__';

// ============================================================
// Undo / Redo
// ============================================================
const UNDO_LIMIT = 99;
const undoStack = [];
const redoStack = [];

// Capture a snapshot of all maps (deep clone). Cheap — maps are small.
function snapshotMaps() {
  return state.maps.map(m => ({
    id: m.id,
    name: m.name,
    color: m.color,
    updatedAt: m.updatedAt,
    nodes: m.nodes.map(n => ({ ...n }))
  }));
}

// Restore a snapshot into state.maps and rebuild state.doc.
function restoreSnapshot(snap) {
  // Replace maps with the snapshot (also cloning the snapshot so the stack remains immutable)
  state.maps = snap.map(m => ({
    id: m.id,
    name: m.name,
    color: m.color,
    updatedAt: m.updatedAt,
    nodes: m.nodes.map(n => ({ ...n }))
  }));
  if (state.bigPicture) {
    state.doc = buildBigPictureDoc();
  } else {
    // Re-bind state.doc to the same map id
    const activeId = state.doc?.id;
    state.doc = state.maps.find(m => m.id === activeId) || state.maps[0];
    document.getElementById('mapName').textContent = state.doc.name;
  }
  state.selectedId = null;
  state.multiSelected = null;
}

// Push current state onto the undo stack. Call BEFORE making a change.
// Clears the redo stack — branching invalidates previously redoable steps.
function pushUndo() {
  undoStack.push(snapshotMaps());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
}

function undo() {
  if (undoStack.length === 0) { toast('Nothing to undo'); return; }
  // Snapshot CURRENT state into redo, then restore from undo
  redoStack.push(snapshotMaps());
  if (redoStack.length > UNDO_LIMIT) redoStack.shift();
  const snap = undoStack.pop();
  restoreSnapshot(snap);
  render();
  scheduleSave();
  toast('Undone');
}

function redo() {
  if (redoStack.length === 0) { toast('Nothing to redo'); return; }
  undoStack.push(snapshotMaps());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  const snap = redoStack.pop();
  restoreSnapshot(snap);
  render();
  scheduleSave();
  toast('Redone');
}

const svg = document.getElementById('canvas');
const world = document.getElementById('world');
const linksG = document.getElementById('links');
const nodesG = document.getElementById('nodes');
const wrap = document.getElementById('wrap');
const statusEl = document.getElementById('statusValue');

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function applyTransform() {
  world.setAttribute('transform', `translate(${state.panX} ${state.panY}) scale(${state.zoom})`);
  updateFloatActions();
}

// Show / hide the multi-select bar based on state
function updateMultiBar() {
  const bar = document.getElementById('multiBar');
  if (!bar) return;
  if (state.multiSelected && state.multiSelected.size > 0) {
    bar.style.display = 'flex';
    document.getElementById('multiCount').textContent = `${state.multiSelected.size} selected`;
  } else {
    bar.style.display = 'none';
  }
}

// Position the floating action buttons next to the selected node (in screen coords)
function updateFloatActions() {
  const float = document.getElementById('floatActions');
  if (!float) return;
  // Hide when nothing selected, when marquee mode is active, or when selection is the center
  if (!state.selectedId || state.multiSelected) {
    float.style.display = 'none';
    return;
  }
  const node = state.doc.nodes.find(n => n.id === state.selectedId);
  if (!node) {
    float.style.display = 'none';
    return;
  }
  // Centers can be priority-flagged but shouldn't be quick-deleted (would orphan a map)
  const isCenter = node.type === 'center' || (state.bigPicture && node.id.endsWith('__center'));
  const dim = nodeDims(node);
  // Top-right corner of the bubble in world coords
  const wx = node.x + dim.w / 2;
  const wy = node.y - dim.h / 2;
  // Convert to screen coords
  const sx = wx * state.zoom + state.panX;
  const sy = wy * state.zoom + state.panY;
  // Offset just outside the bubble
  const OFF = 8;
  float.style.left = (sx + OFF) + 'px';
  float.style.top = (sy - 30) + 'px';
  float.style.display = 'flex';

  // Priority button reflects current state
  const priBtn = document.getElementById('floatPriority');
  if (node.priority) priBtn.classList.add('priority-on');
  else priBtn.classList.remove('priority-on');

  const dateBtn = document.getElementById('floatDate');
  if (node.dueDate) dateBtn.classList.add('date-on');
  else dateBtn.classList.remove('date-on');

  // Done checkbox — only meaningful for to-dos. Hide for centers/projects.
  const doneBtn = document.getElementById('floatDone');
  if (node.type === 'todo') {
    doneBtn.style.display = 'flex';
    if (node.done) doneBtn.classList.add('done-on');
    else doneBtn.classList.remove('done-on');
  } else {
    doneBtn.style.display = 'none';
  }

  // Hide trash for centers
  document.getElementById('floatDelete').style.display = isCenter ? 'none' : 'flex';
}

// Distance from a pill's center to its edge along direction (ux, uy).
// A pill = rectangle of width w, height h, with semicircular caps of radius h/2.
// Inner straight section runs from -(w/2 - r) to (w/2 - r) along x.
function pillExitDistance(w, h, ux, uy) {
  const r = h / 2;
  const halfStraight = Math.max(0, w / 2 - r);
  // For a circle of radius r centered at origin, exit distance is r.
  // For a pill, exit point depends on direction:
  //   - if the ray hits the middle rectangle section, exit distance follows rectangle math
  //   - if it hits a cap, it follows circle math centered at (±halfStraight, 0)
  if (halfStraight === 0) {
    // pure circle
    return r;
  }
  // Try rectangle exit first (top/bottom edges of central section)
  let tRect = Infinity;
  if (uy !== 0) {
    const t = r / Math.abs(uy);
    const xAtExit = ux * t;
    if (Math.abs(xAtExit) <= halfStraight) tRect = t;
  }
  // Cap exit: solve for intersection with circle at (sign(ux)*halfStraight, 0) of radius r
  // Pick the cap on the side the ray is heading (sign of ux). If ux === 0, ray is vertical,
  // doesn't hit caps via this calculation — rectangle solution above will handle it.
  let tCap = Infinity;
  if (ux !== 0) {
    const cx = Math.sign(ux) * halfStraight;
    // Ray: (t*ux, t*uy), circle: (x - cx)^2 + y^2 = r^2
    // (t*ux - cx)^2 + (t*uy)^2 = r^2
    // t^2 - 2*t*ux*cx + cx^2 - r^2 = 0  (since ux^2+uy^2 = 1)
    const b = -2 * ux * cx;
    const c = cx * cx - r * r;
    const disc = b * b - 4 * c;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      const t1 = (-b + sq) / 2;
      const t2 = (-b - sq) / 2;
      // Want positive t, and the exit point's x must be in the cap region (|x| > halfStraight)
      [t1, t2].forEach(t => {
        if (t > 0) {
          const x = ux * t;
          if (Math.abs(x) >= halfStraight - 0.001) tCap = Math.min(tCap, t);
        }
      });
    }
  }
  return Math.min(tRect, tCap);
}

function trimLine(p, n) {
  const dp = nodeDims(p), dn = nodeDims(n);
  const dx = n.x - p.x, dy = n.y - p.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const tP = pillExitDistance(dp.w, dp.h, ux, uy);
  const tN = pillExitDistance(dn.w, dn.h, -ux, -uy);
  return { x1: p.x + ux * tP, y1: p.y + uy * tP, x2: n.x - ux * tN, y2: n.y - uy * tN };
}

// Whether this map is rendered as an anchor (black) or themed.
// Anchor maps have color 'none' — currently just Family.
function isAnchorMap() {
  return !state.doc || !state.doc.color || state.doc.color === 'none';
}

// Map-level color lookup
function mapColor() {
  if (isAnchorMap()) return null;
  return COLORS[state.doc.color] || null;
}

// Per-node color resolution. Walks up the tree: a node's own color override wins,
// otherwise inherit from nearest ancestor with a color, otherwise fall back to map color.
function findNodeById(id) {
  return state.doc.nodes.find(n => n.id === id);
}

// Returns the color KEY ('none' or 'h{hue}') that applies to this node, after override walk.
function effectiveColorKey(n) {
  // Walk up: own color, then parents, then map fallback
  let cur = n;
  while (cur) {
    if (cur.color) return cur.color; // explicit override (incl. 'none')
    if (!cur.parent) break;
    cur = findNodeById(cur.parent);
    if (!cur) break;
  }
  // Map fallback
  if (state.bigPicture || state.lockedIn) {
    return n._mapColor || 'none';
  }
  return state.doc.color || 'none';
}

function nodeIsAnchor(n) {
  const k = effectiveColorKey(n);
  return !k || k === 'none';
}

function nodeColor(n) {
  const k = effectiveColorKey(n);
  if (!k || k === 'none') return null;
  return COLORS[k] || null;
}

function render() {
  // Rebuild synthetic docs on render so they reflect current source data.
  // Big-picture only rebuilds explicitly (positions are dragged); Locked In is
  // computed every render since sort order can change with date edits.
  if (state.lockedIn) {
    // Preserve selection if possible across rebuilds
    const prevSel = state.selectedId;
    state.doc = buildLockedInDoc();
    if (prevSel && state.doc.nodes.some(n => n.id === prevSel)) {
      // selection still exists in the rebuilt doc
    } else {
      state.selectedId = null;
    }
  }
  linksG.innerHTML = '';
  nodesG.innerHTML = '';
  const byId = Object.fromEntries(state.doc.nodes.map(n => [n.id, n]));

  state.doc.nodes.forEach(n => {
    if (!n.parent) return;
    const p = byId[n.parent];
    if (!p) return;
    const t = trimLine(p, n);
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', t.x1); line.setAttribute('y1', t.y1);
    line.setAttribute('x2', t.x2); line.setAttribute('y2', t.y2);

    const nAnchor = nodeIsAnchor(n);
    const nMc = nodeColor(n);

    if (nAnchor) {
      line.setAttribute('stroke', 'rgba(10,10,10,0.5)');
      line.setAttribute('stroke-width', n.type === 'todo' ? 1 : 1.25);
    } else if (nMc) {
      line.setAttribute('stroke', nMc.todoBorder);
      line.setAttribute('stroke-width', n.type === 'todo' ? 1 : 1.25);
      line.setAttribute('stroke-opacity', n.type === 'todo' ? '0.6' : '0.85');
    } else {
      line.setAttribute('stroke', n.type === 'todo' ? 'rgba(10,10,10,0.18)' : 'rgba(10,10,10,0.4)');
      line.setAttribute('stroke-width', n.type === 'todo' ? 0.75 : 1);
      if (n.type === 'todo') line.setAttribute('stroke-dasharray', '2 3');
    }
    linksG.appendChild(line);
  });

  state.doc.nodes.forEach(n => {
    const dim = nodeDims(n);
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('data-id', n.id);
    g.setAttribute('transform', `translate(${n.x} ${n.y})`);
    g.style.cursor = 'pointer';

    const isSel = state.selectedId === n.id;
    const nAnchor = nodeIsAnchor(n);
    const nMc = nodeColor(n);
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', -dim.w / 2);
    rect.setAttribute('y', -dim.h / 2);
    rect.setAttribute('width', dim.w);
    rect.setAttribute('height', dim.h);
    rect.setAttribute('rx', dim.rx);
    rect.setAttribute('ry', dim.rx);

    // Resolve fill + stroke. Anchor maps render solid black throughout.
    // Themed maps use the map's color for projects/todos; center takes the map's color too.
    let fill, stroke;
    if (n.type === 'center') {
      if (nMc) {
        fill = nMc.fill;
        stroke = nMc.fill;
      } else {
        fill = '#0a0a0a';
        stroke = '#0a0a0a';
      }
    } else if (nAnchor) {
      fill = '#0a0a0a';
      stroke = '#0a0a0a';
    } else if (n.done) {
      fill = '#f3f1ea';
      stroke = '#aeaea6';
    } else if (nMc && n.type === 'project') {
      fill = nMc.fill;
      stroke = nMc.fill;
    } else if (nMc && n.type === 'todo') {
      fill = nMc.todoFill;
      stroke = nMc.todoBorder;
    } else if (n.type === 'family') {
      // 'family' type used inside anchor maps for sub-anchors (Wife, Kids, House)
      fill = '#0a0a0a';
      stroke = '#0a0a0a';
    } else {
      fill = '#fafaf7';
      stroke = '#0a0a0a';
    }
    rect.setAttribute('fill', fill);
    const flagged = n.priority || n.dueDate;
    rect.setAttribute('stroke', flagged ? '#c73c2e' : stroke);
    rect.setAttribute('stroke-width', flagged ? 1.6 : (isSel ? 2.5 : 1));

    // Reparent visual states
    const reparenting = state.drag && state.drag.type === 'reparent';
    if (reparenting) {
      const isDragged = state.drag.id === n.id;
      const isHoverTarget = state.drag.hoverTargetId === n.id;
      if (isHoverTarget) {
        rect.setAttribute('stroke', '#0a0a0a');
        rect.setAttribute('stroke-width', '3');
      } else if (!isDragged) {
        g.setAttribute('opacity', '0.3');
      }
    }

    g.appendChild(rect);

    // Hover target glow ring (after rect so it sits on top)
    if (reparenting && state.drag.hoverTargetId === n.id) {
      const glow = document.createElementNS(SVG_NS, 'rect');
      glow.setAttribute('x', -dim.w / 2 - 6);
      glow.setAttribute('y', -dim.h / 2 - 6);
      glow.setAttribute('width', dim.w + 12);
      glow.setAttribute('height', dim.h + 12);
      glow.setAttribute('rx', dim.rx + 6);
      glow.setAttribute('ry', dim.rx + 6);
      glow.setAttribute('fill', 'none');
      glow.setAttribute('stroke', '#0a0a0a');
      glow.setAttribute('stroke-width', '0.8');
      glow.setAttribute('stroke-dasharray', '4 3');
      glow.style.pointerEvents = 'none';
      g.appendChild(glow);
    }

    // Multi-select highlight — dashed outer border
    if (state.multiSelected && state.multiSelected.has(n.id)) {
      const MS_OFFSET = 4;
      const ms = document.createElementNS(SVG_NS, 'rect');
      ms.setAttribute('x', -dim.w / 2 - MS_OFFSET);
      ms.setAttribute('y', -dim.h / 2 - MS_OFFSET);
      ms.setAttribute('width', dim.w + MS_OFFSET * 2);
      ms.setAttribute('height', dim.h + MS_OFFSET * 2);
      ms.setAttribute('rx', dim.rx + MS_OFFSET);
      ms.setAttribute('ry', dim.rx + MS_OFFSET);
      ms.setAttribute('fill', 'none');
      ms.setAttribute('stroke', '#0a0a0a');
      ms.setAttribute('stroke-width', '1');
      ms.setAttribute('stroke-dasharray', '3 3');
      ms.style.pointerEvents = 'none';
      g.appendChild(ms);
    }

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('font-size', dim.fontSize);
    text.style.pointerEvents = 'none';
    text.style.userSelect = 'none';

    const onDark = (n.type === 'center' || nAnchor || n.type === 'family');

    if (n.type === 'center') {
      text.setAttribute('font-family', "'Times New Roman', Georgia, serif");
      text.setAttribute('font-style', 'italic');
      text.setAttribute('fill', '#fafaf7');
    } else if (n.type === 'family') {
      text.setAttribute('font-family', "'Times New Roman', Georgia, serif");
      text.setAttribute('font-weight', '500');
      text.setAttribute('fill', '#fafaf7');
    } else if (n.type === 'project') {
      text.setAttribute('font-family', "'Times New Roman', Georgia, serif");
      text.setAttribute('font-weight', 'bold');
      if (n.done) text.setAttribute('fill', '#aeaea6');
      else if (nAnchor) text.setAttribute('fill', '#fafaf7');
      else if (nMc) text.setAttribute('fill', nMc.text);
      else text.setAttribute('fill', '#0a0a0a');
    } else { // todo
      text.setAttribute('font-family', "ui-monospace, Menlo, monospace");
      if (onDark) {
        text.setAttribute('fill', n.done ? '#6b6b66' : '#fafaf7');
      } else if (nMc && !n.done) {
        text.setAttribute('fill', '#2a2a28');
      } else {
        text.setAttribute('fill', n.done ? '#aeaea6' : '#0a0a0a');
      }
      if (n.done) text.setAttribute('text-decoration', 'line-through');
    }
    if (n.bold) {
      text.setAttribute('font-weight', '900');
      // also un-italicize centers when bold so it reads as emphasis not flourish
      text.setAttribute('font-style', 'normal');
    }
    text.textContent = n.bold ? (n.label || '').toUpperCase() : n.label;
    g.appendChild(text);

    if (n.type === 'todo' && n.done) {
      const check = document.createElementNS(SVG_NS, 'text');
      check.setAttribute('x', -dim.w / 2 + 12);
      check.setAttribute('y', 0);
      check.setAttribute('font-size', 10);
      check.setAttribute('fill', onDark ? '#aeaea6' : '#6b6b66');
      check.setAttribute('text-anchor', 'middle');
      check.setAttribute('dominant-baseline', 'central');
      check.textContent = '✓';
      check.style.pointerEvents = 'none';
      g.appendChild(check);
    }

    // Due-date micro node — small pill below the main bubble showing date/time + countdown
    // Source-map badge — shown only in Locked In to label which map each item came from
    if (state.lockedIn && n._mapName) {
      const badge = document.createElementNS(SVG_NS, 'text');
      badge.setAttribute('text-anchor', 'end');
      badge.setAttribute('dominant-baseline', 'central');
      badge.setAttribute('font-family', "ui-monospace, Menlo, monospace");
      badge.setAttribute('font-size', '10');
      badge.setAttribute('letter-spacing', '0.06em');
      badge.setAttribute('fill', '#6b6b66');
      badge.setAttribute('x', -dim.w / 2 - 16);
      badge.setAttribute('y', 0);
      badge.style.pointerEvents = 'none';
      badge.textContent = n._mapName.toUpperCase();
      g.appendChild(badge);
    }

    if (n.dueDate) {
      const overdue = isOverdue(n.dueDate);
      const dateText = formatDueDate(n.dueDate);
      const cdText = formatCountdown(n.dueDate);

      // Measure both lines so the micro pill auto-sizes to its widest line
      const dateFont = "10px ui-monospace, Menlo, monospace";
      const cdFont = "600 11px ui-monospace, Menlo, monospace";
      const dateW = measureText(dateText, dateFont);
      const cdW = measureText(cdText, cdFont);
      const microW = Math.max(60, Math.ceil(Math.max(dateW, cdW)) + 18);
      const microH = 32;
      const microY = dim.h / 2 + 28; // below the bubble with breathing room
      const microRx = microH / 2;

      // Connecting hairline from bubble bottom edge to micro top
      const link = document.createElementNS(SVG_NS, 'line');
      link.setAttribute('x1', 0);
      link.setAttribute('y1', dim.h / 2);
      link.setAttribute('x2', 0);
      link.setAttribute('y2', microY - microH / 2);
      link.setAttribute('stroke', overdue ? '#c73c2e' : 'rgba(10,10,10,0.3)');
      link.setAttribute('stroke-width', '0.75');
      link.style.pointerEvents = 'none';
      g.appendChild(link);

      // Micro pill background
      const microRect = document.createElementNS(SVG_NS, 'rect');
      microRect.setAttribute('x', -microW / 2);
      microRect.setAttribute('y', microY - microH / 2);
      microRect.setAttribute('width', microW);
      microRect.setAttribute('height', microH);
      microRect.setAttribute('rx', microRx);
      microRect.setAttribute('ry', microRx);
      microRect.setAttribute('fill', overdue ? '#c73c2e' : '#fafaf7');
      microRect.setAttribute('stroke', '#c73c2e');
      microRect.setAttribute('stroke-width', '1');
      microRect.style.pointerEvents = 'none';
      g.appendChild(microRect);

      // Date/time line (top)
      const microDate = document.createElementNS(SVG_NS, 'text');
      microDate.setAttribute('text-anchor', 'middle');
      microDate.setAttribute('dominant-baseline', 'central');
      microDate.setAttribute('font-family', "ui-monospace, Menlo, monospace");
      microDate.setAttribute('font-size', '9');
      microDate.setAttribute('fill', overdue ? '#fafaf7' : '#6b6b66');
      microDate.setAttribute('x', 0);
      microDate.setAttribute('y', microY - 7);
      microDate.style.pointerEvents = 'none';
      microDate.textContent = dateText;
      g.appendChild(microDate);

      // Countdown line (bottom) — bolder/larger
      const microCd = document.createElementNS(SVG_NS, 'text');
      microCd.setAttribute('text-anchor', 'middle');
      microCd.setAttribute('dominant-baseline', 'central');
      microCd.setAttribute('font-family', "ui-monospace, Menlo, monospace");
      microCd.setAttribute('font-size', '11');
      microCd.setAttribute('font-weight', '600');
      microCd.setAttribute('fill', overdue ? '#fafaf7' : '#c73c2e');
      microCd.setAttribute('x', 0);
      microCd.setAttribute('y', microY + 6);
      microCd.style.pointerEvents = 'none';
      microCd.textContent = cdText;
      // Mark for live updates
      microCd.setAttribute('data-countdown-for', n.id);
      g.appendChild(microCd);
    }

    nodesG.appendChild(g);
  });

  if (state.selectedId) {
    const selNode = state.doc.nodes.find(n => n.id === state.selectedId);
    if (selNode) {
      const datePart = selNode.dueDate ? ` · due ${formatDueDate(selNode.dueDate)}` : '';
      statusEl.textContent = (selNode.label || 'none') + datePart;
    } else {
      statusEl.textContent = 'none';
    }
  } else {
    statusEl.textContent = 'none';
  }

  const sel = state.selectedId;
  const bp = state.bigPicture;
  const li = state.lockedIn;
  const isCenterSel = !sel ? false : ((bp || li) ? sel.endsWith('__center') : sel === 'center');

  if (li) {
    // Locked In: read-only-ish, no adding
    document.getElementById('addProject').disabled = true;
    document.getElementById('addTodo').disabled = true;
  } else if (bp) {
    // In big-picture: + Project requires a center selected (so we know which map to add to)
    document.getElementById('addProject').disabled = !isCenterSel;
    // + To-do requires any non-center node selected (we add a child to it in its source map)
    document.getElementById('addTodo').disabled = !sel || isCenterSel;
  } else {
    document.getElementById('addProject').disabled = false;
    document.getElementById('addTodo').disabled = !sel;
  }
  document.getElementById('editNode').disabled = !sel;
  // Focus map works in both Big Picture and Locked In (source-aware modes)
  document.getElementById('focusMap').disabled = (!bp && !li) || !sel;
  document.getElementById('deleteNode').disabled = !sel || isCenterSel;
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;

  updateFloatActions();
  updateMultiBar();
}

// ============================================================
// Pointer / gesture
// ============================================================
const activePointers = new Map();
function svgPoint(cx, cy) {
  const pt = svg.createSVGPoint();
  pt.x = cx; pt.y = cy;
  const ctm = svg.getScreenCTM().inverse();
  const p = pt.matrixTransform(ctm);
  return { x: (p.x - state.panX) / state.zoom, y: (p.y - state.panY) / state.zoom };
}

svg.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2) {
    state.drag = null;
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const cx = (pts[0].x + pts[1].x) / 2;
    const cy = (pts[0].y + pts[1].y) / 2;
    state.pinch = { startDist: dist, startZoom: state.zoom, cx, cy };
    return;
  }

  const target = e.target.closest('g[data-id]');
  const marqueeKey = e.metaKey || e.ctrlKey;

  if (!target && marqueeKey && !state.lockedIn) {
    // Start marquee selection — clear any prior multi-selection
    const p = svgPoint(e.clientX, e.clientY);
    state.marquee = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    state.multiSelected = null;
    state.selectedId = null;
    render();
    svg.setPointerCapture(e.pointerId);
    return;
  }

  if (target) {
    const id = target.getAttribute('data-id');
    const inMulti = state.multiSelected && state.multiSelected.has(id);

    if (inMulti) {
      // Group drag — capture starting positions of every selected node
      const node = state.doc.nodes.find(n => n.id === id);
      const p = svgPoint(e.clientX, e.clientY);
      const groupStart = new Map();
      state.multiSelected.forEach(sid => {
        const sn = state.doc.nodes.find(n => n.id === sid);
        if (sn) groupStart.set(sid, { x: sn.x, y: sn.y });
      });
      state.drag = {
        type: 'group',
        anchorId: id,
        anchorStartX: node.x,
        anchorStartY: node.y,
        offX: p.x - node.x,
        offY: p.y - node.y,
        groupStart,
        startX: e.clientX,
        startY: e.clientY,
        moved: false
      };
    } else {
      if (state.selectedId !== id) { state.selectedId = id; render(); }
      // Tapping outside the multi-selection clears it
      if (state.multiSelected) { state.multiSelected = null; render(); }
      const node = state.doc.nodes.find(n => n.id === id);
      const p = svgPoint(e.clientX, e.clientY);
      // In Locked In mode, drag is disabled — just register a tap for double-tap detection
      if (state.lockedIn) {
        state.drag = { type: 'tap', id, startX: e.clientX, startY: e.clientY, moved: false };
      } else {
        state.drag = { type: 'node', id, offX: p.x - node.x, offY: p.y - node.y, startX: e.clientX, startY: e.clientY, moved: false };
        // Set up long-press → reparent mode (only for non-center nodes; centers can't be reparented)
        const isCenter = node.type === 'center' || (state.bigPicture && id.endsWith('__center'));
        if (!isCenter) {
          state.drag.longPressTimer = setTimeout(() => {
            // Only convert if user hasn't started dragging yet
            if (state.drag && state.drag.id === id && !state.drag.moved) {
              state.drag.type = 'reparent';
              state.drag.longPressTimer = null;
              render();
              // Haptic-style feedback via toast
              toast('Move to new parent');
            }
          }, 500);
        }
      }
    }
  } else {
    // Empty space tap clears multi-selection
    if (state.multiSelected) { state.multiSelected = null; render(); }
    state.drag = { type: 'pan', startX: e.clientX, startY: e.clientY, startPanX: state.panX, startPanY: state.panY };
    wrap.classList.add('grabbing');
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', (e) => {
  if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (state.marquee) {
    const p = svgPoint(e.clientX, e.clientY);
    state.marquee.x1 = p.x;
    state.marquee.y1 = p.y;
    drawMarquee();
    return;
  }

  if (state.pinch && activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const newZoom = clamp(state.pinch.startZoom * (dist / state.pinch.startDist), MIN_ZOOM, MAX_ZOOM);
    const rect = svg.getBoundingClientRect();
    const mx = state.pinch.cx - rect.left;
    const my = state.pinch.cy - rect.top;
    const ratio = newZoom / state.zoom;
    state.panX = mx - (mx - state.panX) * ratio;
    state.panY = my - (my - state.panY) * ratio;
    state.zoom = newZoom;
    applyTransform();
    return;
  }

  if (!state.drag) return;
  if (state.drag.type === 'node') {
    const dx = Math.abs(e.clientX - state.drag.startX);
    const dy = Math.abs(e.clientY - state.drag.startY);
    if (!state.drag.moved && (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD)) {
      state.drag.moved = true;
      // Cancel long-press timer — user is dragging, not holding
      if (state.drag.longPressTimer) {
        clearTimeout(state.drag.longPressTimer);
        state.drag.longPressTimer = null;
      }
      pushUndo();
    }
    if (state.drag.moved) {
      const p = svgPoint(e.clientX, e.clientY);
      const node = state.doc.nodes.find(n => n.id === state.drag.id);
      node.x = p.x - state.drag.offX;
      node.y = p.y - state.drag.offY;
      // In big-picture mode, also update the source node's x/y (subtract cluster offset)
      if (state.bigPicture && node._sourceMapId) {
        syncBigPictureNodePosition(node);
      }
      render();
      scheduleSave();
    }
  } else if (state.drag.type === 'reparent') {
    // Move the node visually, find the closest valid parent under cursor
    const p = svgPoint(e.clientX, e.clientY);
    const node = state.doc.nodes.find(n => n.id === state.drag.id);
    if (!state.drag.startNodeX) {
      state.drag.startNodeX = node.x;
      state.drag.startNodeY = node.y;
    }
    node.x = p.x - state.drag.offX;
    node.y = p.y - state.drag.offY;
    // Find the nearest valid parent target. Skip self and descendants (would cycle).
    state.drag.hoverTargetId = findReparentTarget(node, p.x, p.y);
    render();
    // Don't persist during reparent drag — only on commit
  } else if (state.drag.type === 'group') {
    const dxs = Math.abs(e.clientX - state.drag.startX);
    const dys = Math.abs(e.clientY - state.drag.startY);
    if (!state.drag.moved && (dxs > DRAG_THRESHOLD || dys > DRAG_THRESHOLD)) {
      state.drag.moved = true;
      pushUndo();
    }
    if (state.drag.moved) {
      // Compute delta from anchor's start to current pointer (in world coords)
      const p = svgPoint(e.clientX, e.clientY);
      const newAnchorX = p.x - state.drag.offX;
      const newAnchorY = p.y - state.drag.offY;
      const dxw = newAnchorX - state.drag.anchorStartX;
      const dyw = newAnchorY - state.drag.anchorStartY;
      // Apply delta to every selected node from its captured start position
      state.drag.groupStart.forEach((start, sid) => {
        const sn = state.doc.nodes.find(n => n.id === sid);
        if (!sn) return;
        sn.x = start.x + dxw;
        sn.y = start.y + dyw;
        if (state.bigPicture && sn._sourceMapId) {
          syncBigPictureNodePosition(sn);
        }
      });
      render();
      scheduleSave();
    }
  } else if (state.drag.type === 'pan') {
    state.panX = state.drag.startPanX + (e.clientX - state.drag.startX);
    state.panY = state.drag.startPanY + (e.clientY - state.drag.startY);
    applyTransform();
  }
});

function endPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) state.pinch = null;
  if (state.drag && state.drag.type === 'pan') wrap.classList.remove('grabbing');

  // Cancel any pending long-press timer
  if (state.drag && state.drag.longPressTimer) {
    clearTimeout(state.drag.longPressTimer);
    state.drag.longPressTimer = null;
  }

  // Reparent commit / revert
  if (state.drag && state.drag.type === 'reparent') {
    const draggedId = state.drag.id;
    const targetId = state.drag.hoverTargetId;
    const startX = state.drag.startNodeX;
    const startY = state.drag.startNodeY;
    const dragged = state.doc.nodes.find(n => n.id === draggedId);
    // Clear drag state FIRST so render after this doesn't apply dim treatment
    state.drag = null;

    if (targetId && dragged && targetId !== dragged.parent) {
      // Commit reparent
      pushUndo();
      const newParentId = targetId;
      // Resolve source nodes for big-picture write-through
      const target = state.doc.nodes.find(n => n.id === targetId);
      dragged.parent = newParentId;
      // Clear color override so node inherits the new arm's color naturally.
      // Recursively clear children too — if you move a project arm, its to-dos
      // should re-tint to the new parent's color, not stay locked to the old one.
      clearColorOverridesRecursive(draggedId);
      // Snap dragged node to a sensible position relative to new parent
      const radius = dragged.type === 'family' ? 220 : (dragged.type === 'project' ? 320 : 150);
      const childCount = state.doc.nodes.filter(n => n.parent === newParentId && n.id !== draggedId).length;
      const baseAngle = -Math.PI / 2 + (childCount * 0.55);
      dragged.x = target.x + Math.cos(baseAngle) * radius;
      dragged.y = target.y + Math.sin(baseAngle) * radius;
      // Big-picture: also write through to source nodes
      if (state.bigPicture && dragged._sourceMapId && target._sourceMapId === dragged._sourceMapId) {
        const map = state.maps.find(m => m.id === dragged._sourceMapId);
        const srcDragged = map?.nodes.find(s => s.id === dragged._sourceId);
        const srcTarget = map?.nodes.find(s => s.id === target._sourceId);
        if (srcDragged && srcTarget) {
          srcDragged.parent = srcTarget.id;
          srcDragged.x = srcTarget.x + Math.cos(baseAngle) * radius;
          srcDragged.y = srcTarget.y + Math.sin(baseAngle) * radius;
          // Mirror the color clear into the source map too
          delete srcDragged.color;
          // Recursively clear in source
          const srcDescendants = collectDescendantsInMap(map, srcDragged.id);
          srcDescendants.forEach(id => {
            const sn = map.nodes.find(x => x.id === id);
            if (sn) delete sn.color;
          });
        }
      }
      toast('Moved to ' + (target.label || 'new parent'));
      render();
      scheduleSave();
    } else {
      // No target — revert position
      if (dragged && startX !== undefined) {
        dragged.x = startX;
        dragged.y = startY;
        if (state.bigPicture && dragged._sourceMapId) {
          syncBigPictureNodePosition(dragged);
        }
      }
      render();
    }
  }

  // Double-tap detection — when a node tap ends without movement, check for a recent prior tap on same node
  if (state.drag && (state.drag.type === 'node' || state.drag.type === 'tap') && !state.drag.moved) {
    const now = performance.now();
    const tappedId = state.drag.id;
    if (state.lastTap && state.lastTap.id === tappedId && (now - state.lastTap.t) < 350) {
      state.lastTap = null;
      // Defer to next tick so the selection render flushes first
      setTimeout(() => openEdit(tappedId), 0);
    } else {
      state.lastTap = { id: tappedId, t: now };
    }
  }

  state.drag = null;

  if (state.marquee) {
    finalizeMarquee();
    state.marquee = null;
    clearMarqueeRect();
  }
}

function drawMarquee() {
  const layer = document.getElementById('marqueeLayer');
  if (!layer || !state.marquee) return;
  const m = state.marquee;
  const x = Math.min(m.x0, m.x1);
  const y = Math.min(m.y0, m.y1);
  const w = Math.abs(m.x1 - m.x0);
  const h = Math.abs(m.y1 - m.y0);
  // Marquee rect is in WORLD coords — apply current transform so it renders aligned
  // We render it as a child of the world group instead so it stays correctly placed.
  layer.innerHTML = '';
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('transform', `translate(${state.panX} ${state.panY}) scale(${state.zoom})`);
  const r = document.createElementNS(SVG_NS, 'rect');
  r.setAttribute('class', 'marquee-rect');
  r.setAttribute('x', x);
  r.setAttribute('y', y);
  r.setAttribute('width', w);
  r.setAttribute('height', h);
  g.appendChild(r);
  layer.appendChild(g);
}

function clearMarqueeRect() {
  const layer = document.getElementById('marqueeLayer');
  if (layer) layer.innerHTML = '';
}

function finalizeMarquee() {
  const m = state.marquee;
  if (!m) return;
  const minX = Math.min(m.x0, m.x1);
  const maxX = Math.max(m.x0, m.x1);
  const minY = Math.min(m.y0, m.y1);
  const maxY = Math.max(m.y0, m.y1);
  // Tiny rectangles (clicks with modifier) — ignore
  if ((maxX - minX) < 5 && (maxY - minY) < 5) return;
  const set = new Set();
  state.doc.nodes.forEach(n => {
    if (n.x >= minX && n.x <= maxX && n.y >= minY && n.y <= maxY) {
      set.add(n.id);
    }
  });
  if (set.size > 0) {
    state.multiSelected = set;
    state.selectedId = null;
  }
  render();
}

svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);

svg.addEventListener('dblclick', (e) => {
  const target = e.target.closest('g[data-id]');
  if (!target) return;
  state.selectedId = target.getAttribute('data-id');
  render();
  openEdit(state.selectedId);
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const newZoom = clamp(state.zoom * delta, MIN_ZOOM, MAX_ZOOM);
  const ratio = newZoom / state.zoom;
  state.panX = mx - (mx - state.panX) * ratio;
  state.panY = my - (my - state.panY) * ratio;
  state.zoom = newZoom;
  applyTransform();
}, { passive: false });

// ============================================================
// Sheet / modal
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openSheet(opts) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    const extras = opts.extras || [];
    const showSwatches = !!opts.swatches;
    let chosenColor = opts.swatches ? (opts.swatches.current || 'none') : null;

    const swatchHtml = showSwatches ? (() => {
      const wheelRadius = 80; // px from center
      const dots = WHEEL_HUES.map((hue, i) => {
        const key = 'h' + hue;
        const c = COLORS[key];
        // Start at top (12 o'clock) and go clockwise
        const angle = (i / WHEEL_HUES.length) * Math.PI * 2 - Math.PI / 2;
        const x = 100 + Math.cos(angle) * wheelRadius;
        const y = 100 + Math.sin(angle) * wheelRadius;
        const cls = 'dot' + (key === chosenColor ? ' selected' : '');
        return `<button type="button" class="${cls}" data-color="${key}" style="background: ${c.fill}; left: ${x}px; top: ${y}px;" aria-label="hue ${hue}"></button>`;
      }).join('');
      const noneCls = 'dot none' + (chosenColor === 'none' ? ' selected' : '');
      const noneDot = `<button type="button" class="${noneCls}" data-color="none" style="left: 100px; top: 100px;" aria-label="no color"></button>`;
      return `
        <div class="color-wheel-wrap">
          <div class="color-wheel-label">Color</div>
          <div class="color-wheel">
            ${dots}
            ${noneDot}
          </div>
        </div>
      `;
    })() : '';

    bg.innerHTML = `
      <div class="sheet" role="dialog">
        <h3>${escapeHtml(opts.title)}</h3>
        <div class="sub">${escapeHtml(opts.sub || '')}</div>
        <input type="text" id="sheetIn" value="${escapeHtml(opts.value || '')}" placeholder="${escapeHtml(opts.placeholder || '')}" />
        ${swatchHtml}
        <div class="sheet-actions">
          <button data-action="cancel">Cancel</button>
          ${extras.map(b => `<button data-action="${b.action}">${escapeHtml(b.label)}</button>`).join('')}
          <button class="primary" data-action="save">${escapeHtml(opts.primary || 'Save')}</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const input = bg.querySelector('#sheetIn');
    setTimeout(() => input.focus(), 50);

    if (showSwatches) {
      bg.querySelectorAll('.color-wheel .dot').forEach(sw => {
        sw.addEventListener('click', () => {
          chosenColor = sw.getAttribute('data-color');
          bg.querySelectorAll('.color-wheel .dot').forEach(s => s.classList.remove('selected'));
          sw.classList.add('selected');
        });
      });
    }

    function close(r) {
      if (r && showSwatches) r.color = chosenColor;
      bg.remove();
      resolve(r);
    }
    bg.addEventListener('click', e => { if (e.target === bg) close(null); });
    bg.querySelectorAll('button[data-action]').forEach(b => {
      b.addEventListener('click', () => {
        const a = b.getAttribute('data-action');
        if (a === 'cancel') return close(null);
        if (a === 'save') {
          const v = input.value.trim();
          if (!v) return close(null);
          return close({ action: 'save', value: v });
        }
        close({ action: a, value: input.value.trim() });
      });
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const v = input.value.trim();
        if (v) close({ action: 'save', value: v });
      } else if (e.key === 'Escape') close(null);
    });
  });
}

// Date-picker sheet — separate from openSheet because the structure is different.
// Resolves with { action: 'save', value: 'YYYY-MM-DD' } or { action: 'clear' } or null.
function openDateSheet(opts) {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    const initial = opts.value || '';
    // Split combined value into date and time. If only a date is stored (legacy),
    // default the time to 17:00.
    let initialDate = '', initialTime = '17:00';
    if (initial) {
      const parts = initial.split('T');
      initialDate = parts[0] || '';
      if (parts[1]) initialTime = parts[1].slice(0, 5);
    }
    bg.innerHTML = `
      <div class="sheet" role="dialog">
        <h3>${escapeHtml(opts.title || 'Due date')}</h3>
        <div class="sub">${escapeHtml(opts.sub || '')}</div>
        <div class="date-row">
          <div class="date-field">
            <label class="date-label">Date</label>
            <input type="date" id="dateIn" value="${escapeHtml(initialDate)}" />
          </div>
          <div class="date-field">
            <label class="date-label">Time</label>
            <input type="time" id="timeIn" value="${escapeHtml(initialTime)}" />
          </div>
        </div>
        <div class="sheet-actions">
          <button data-action="cancel">Cancel</button>
          ${initial ? '<button data-action="clear">Clear date</button>' : ''}
          <button class="primary" data-action="save">Save</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const dateInput = bg.querySelector('#dateIn');
    const timeInput = bg.querySelector('#timeIn');
    setTimeout(() => { try { dateInput.focus(); dateInput.showPicker?.(); } catch {} }, 50);

    function close(r) { bg.remove(); resolve(r); }
    bg.addEventListener('click', e => { if (e.target === bg) close(null); });
    bg.querySelectorAll('button[data-action]').forEach(b => {
      b.addEventListener('click', () => {
        const a = b.getAttribute('data-action');
        if (a === 'cancel') return close(null);
        if (a === 'clear') return close({ action: 'clear' });
        if (a === 'save') {
          const d = dateInput.value;
          if (!d) return close({ action: 'clear' });
          const t = timeInput.value || '17:00';
          return close({ action: 'save', value: d + 'T' + t });
        }
      });
    });
  });
}

// Parse a stored due date string ('YYYY-MM-DD' legacy or 'YYYY-MM-DDTHH:MM') to a Date object.
// Parses as LOCAL time (not UTC) — Safari otherwise interprets bare ISO strings without
// a Z or offset as UTC, which made "today" times land in the past.
function parseDueDate(stored) {
  if (!stored) return null;
  const parts = stored.split('T');
  const dateStr = parts[0];
  const timeStr = parts[1] || '17:00';
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mm] = timeStr.split(':').map(Number);
  if (!y || !m || !d) return null;
  const local = new Date(y, m - 1, d, hh || 0, mm || 0, 0, 0);
  return isNaN(local.getTime()) ? null : local;
}

// Format the due date for display in the micro node and status pill.
// Examples: "Nov 12 · 5p", "Today · 9:30a", "Tomorrow · 5p"
function formatDueDate(stored) {
  const d = parseDueDate(stored);
  if (!d) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const isTomorrow = d.toDateString() === tomorrow.toDateString();

  let datePart;
  if (sameDay) datePart = 'Today';
  else if (isTomorrow) datePart = 'Tomorrow';
  else if (d.getFullYear() === now.getFullYear()) datePart = `${months[d.getMonth()]} ${d.getDate()}`;
  else datePart = `${months[d.getMonth()]} ${d.getDate()} '${String(d.getFullYear()).slice(2)}`;

  // Time: only include if not midnight (which is a sloppy default the user didn't pick)
  let timePart = '';
  const h = d.getHours();
  const m = d.getMinutes();
  if (!(h === 0 && m === 0)) {
    const period = h >= 12 ? 'p' : 'a';
    const displayH = h % 12 === 0 ? 12 : h % 12;
    timePart = m === 0 ? `${displayH}${period}` : `${displayH}:${String(m).padStart(2, '0')}${period}`;
  }
  return timePart ? `${datePart} · ${timePart}` : datePart;
}

// Format the countdown to a due date with all four units, zero-padded.
// Always renders as "DDd HHh MMm SSs" so the layout never shifts.
// Past-due flips to a leading minus.
function formatCountdown(stored) {
  const d = parseDueDate(stored);
  if (!d) return '';
  const now = new Date();
  let ms = d.getTime() - now.getTime();
  const overdue = ms < 0;
  ms = Math.abs(ms);
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  const sign = overdue ? '−' : '';
  return `${sign}${pad(days)}d ${pad(hours)}h ${pad(mins)}m ${pad(secs)}s`;
}

// True when the due date is within the next 24 hours or already past
function isImminentOrOverdue(stored) {
  const d = parseDueDate(stored);
  if (!d) return false;
  const ms = d.getTime() - Date.now();
  return ms < (24 * 60 * 60 * 1000);
}

function isOverdue(stored) {
  const d = parseDueDate(stored);
  if (!d) return false;
  return d.getTime() < Date.now();
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function openEdit(id) {
  const node = state.doc.nodes.find(n => n.id === id);
  if (!node) return;
  const extras = node.type === 'todo' ? [{ label: node.done ? 'Reopen' : 'Mark done', action: 'toggle' }] : [];

  // Show color wheel for centers and projects — they're the "color owners" in the tree.
  // To-dos and family-anchors inherit; no per-node override on those.
  const showColor = node.type === 'center' || node.type === 'project';

  const sheetOpts = {
    title: 'Edit', sub: node.type, value: node.label,
    placeholder: 'Label', primary: 'Save', extras
  };
  if (showColor) {
    // Show what's actually overridden on this node — 'none' means "no override / inherit"
    // For center nodes that haven't been individually colored, show the map's color as the starting point.
    let currentKey;
    if (node.color) {
      currentKey = node.color;
    } else if (node.type === 'center') {
      // Centers default-display the map's color so the wheel reflects what they're showing
      currentKey = state.bigPicture ? (node._mapColor || 'none') : (state.doc.color || 'none');
    } else {
      currentKey = 'none';
    }
    sheetOpts.swatches = { current: currentKey };
  }

  openSheet(sheetOpts).then(r => {
    if (!r) return;
    const src = state.bigPicture && node._sourceMapId
      ? state.maps.find(m => m.id === node._sourceMapId)?.nodes.find(s => s.id === node._sourceId)
      : null;

    if (r.action === 'save') {
      pushUndo();
      node.label = r.value;
      if (src) src.label = r.value;
      if (showColor && r.color !== undefined) {
        node.color = r.color;
        if (src) src.color = r.color;
      }
      render();
      scheduleSave();
    }
    else if (r.action === 'toggle') {
      pushUndo();
      if (r.value && r.value !== node.label) {
        node.label = r.value;
        if (src) src.label = r.value;
      }
      node.done = !node.done;
      if (src) src.done = node.done;
      render();
      scheduleSave();
    }
  });
}

// ============================================================
// Persistence
// ============================================================
function scheduleSave() {
  if (state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(persist, SAVE_DEBOUNCE_MS);
}
async function persist() {
  if (state.bigPicture) {
    // Save every real map — drag/edit in big-picture writes through to sources.
    const now = Date.now();
    for (const m of state.maps) {
      m.updatedAt = now;
      await saveMap(m);
    }
    return;
  }
  state.doc.updatedAt = Date.now();
  await saveMap(state.doc);
}

// ============================================================
// Buttons
// ============================================================
document.getElementById('zoomIn').onclick = () => { state.zoom = clamp(state.zoom * 1.2, MIN_ZOOM, MAX_ZOOM); applyTransform(); };
document.getElementById('zoomOut').onclick = () => { state.zoom = clamp(state.zoom / 1.2, MIN_ZOOM, MAX_ZOOM); applyTransform(); };
document.getElementById('zoomReset').onclick = () => { centerOnCenter(); };

document.getElementById('undoBtn').onclick = () => undo();
document.getElementById('redoBtn').onclick = () => redo();

document.getElementById('addProject').onclick = async () => {
  // In big-picture, addProject only enabled when a center is selected.
  // We add to the source map of that center.
  let targetMap, targetCenter;
  if (state.bigPicture) {
    if (!state.selectedId || !state.selectedId.endsWith('__center')) {
      toast('Select a center first');
      return;
    }
    const synth = state.doc.nodes.find(n => n.id === state.selectedId);
    targetMap = state.maps.find(m => m.id === synth._sourceMapId);
    if (!targetMap) return;
    targetCenter = targetMap.nodes.find(n => n.id === 'center');
  } else {
    targetMap = state.doc;
    targetCenter = state.doc.nodes.find(n => n.id === 'center');
  }

  const r = await openSheet({ title: 'New project', sub: `arm off ${targetMap.name}`, placeholder: 'e.g. Documentary', primary: 'Add' });
  if (!r) return;
  pushUndo();

  const existing = targetMap.nodes.filter(n => n.type === 'project' && n.parent === 'center');
  const angle = (existing.length / Math.max(6, existing.length + 1)) * Math.PI * 2 - Math.PI / 2;
  const id = nid();
  const newSrc = {
    id, label: r.value, type: 'project',
    x: targetCenter.x + Math.cos(angle) * 320,
    y: targetCenter.y + Math.sin(angle) * 320,
    parent: 'center'
  };
  targetMap.nodes.push(newSrc);

  if (state.bigPicture) {
    // Rebuild synthetic doc to include the new node
    state.doc = buildBigPictureDoc();
    state.selectedId = targetMap.id + '__' + id;
  } else {
    state.selectedId = id;
  }
  render();
  scheduleSave();
};

document.getElementById('addTodo').onclick = async () => {
  if (!state.selectedId) { toast('Select something first'); return; }
  const synthOrSrc = state.doc.nodes.find(n => n.id === state.selectedId);
  if (!synthOrSrc) return;

  // Resolve target map + parent node in source space
  let targetMap, parentSrc;
  if (state.bigPicture) {
    targetMap = state.maps.find(m => m.id === synthOrSrc._sourceMapId);
    if (!targetMap) return;
    parentSrc = targetMap.nodes.find(n => n.id === synthOrSrc._sourceId);
  } else {
    targetMap = state.doc;
    parentSrc = synthOrSrc;
  }
  if (!parentSrc) return;

  const isFromCenter = parentSrc.id === 'center';
  const anchorMap = !targetMap.color || targetMap.color === 'none';
  const childType = (isFromCenter && anchorMap) ? 'family' : 'todo';
  const sub = (isFromCenter && anchorMap)
    ? `anchor under ${targetMap.name}`
    : `under ${parentSrc.label}${state.bigPicture ? ' · ' + targetMap.name : ''}`;
  const placeholder = (isFromCenter && anchorMap) ? 'e.g. Kids, House, Wife' : 'next action';
  const title = (isFromCenter && anchorMap) ? 'New anchor' : 'New to-do';

  if (isFromCenter && !anchorMap) {
    toast('Use + Project for the first ring');
    return;
  }

  const r = await openSheet({ title, sub, placeholder, primary: 'Add' });
  if (!r) return;
  pushUndo();

  const grandparentSrc = parentSrc.parent ? targetMap.nodes.find(n => n.id === parentSrc.parent) : null;
  let baseAngle = grandparentSrc
    ? Math.atan2(parentSrc.y - grandparentSrc.y, parentSrc.x - grandparentSrc.x)
    : -Math.PI / 2;
  const childCount = targetMap.nodes.filter(n => n.parent === parentSrc.id).length;
  const spread = (childCount % 2 === 0 ? 1 : -1) * Math.ceil(childCount / 2) * 0.45;
  const angle = baseAngle + spread;
  const radius = childType === 'family' ? 220 : 150;
  const id = nid();
  const newSrc = {
    id, label: r.value, type: childType,
    x: parentSrc.x + Math.cos(angle) * radius,
    y: parentSrc.y + Math.sin(angle) * radius,
    parent: parentSrc.id
  };
  if (childType === 'todo') newSrc.done = false;
  targetMap.nodes.push(newSrc);

  if (state.bigPicture) {
    state.doc = buildBigPictureDoc();
    state.selectedId = targetMap.id + '__' + id;
  } else {
    state.selectedId = id;
  }
  render();
  scheduleSave();
};

// ============================================================
// Helpers for priority toggle + instant delete (sync to source in big-picture)
// ============================================================

// Get { node, src } where src is the source-map node when in big-picture, else the same as node
function resolveNodeAndSource(synthOrSrc) {
  if (state.bigPicture && synthOrSrc._sourceMapId) {
    const map = state.maps.find(m => m.id === synthOrSrc._sourceMapId);
    const src = map?.nodes.find(s => s.id === synthOrSrc._sourceId);
    return { node: synthOrSrc, src };
  }
  return { node: synthOrSrc, src: synthOrSrc };
}

function togglePriority(id) {
  const node = state.doc.nodes.find(n => n.id === id);
  if (!node) return;
  pushUndo();
  const { src } = resolveNodeAndSource(node);
  const newVal = !node.priority;
  node.priority = newVal;
  if (src && src !== node) src.priority = newVal;
  render();
  scheduleSave();
}

// Set bold on a specific node (writes through to source in big-picture)
function setBold(id, val) {
  const node = state.doc.nodes.find(n => n.id === id);
  if (!node) return;
  const { src } = resolveNodeAndSource(node);
  node.bold = val;
  if (src && src !== node) src.bold = val;
}

// Toggle bold on the current selection (single or multi).
// For multi: if any are not-bold turn all on, otherwise turn all off.
function toggleBoldOnSelection() {
  if (state.multiSelected && state.multiSelected.size > 0) {
    pushUndo();
    const ids = Array.from(state.multiSelected);
    const anyOff = ids.some(id => {
      const n = state.doc.nodes.find(x => x.id === id);
      return n && !n.bold;
    });
    ids.forEach(id => setBold(id, anyOff));
    render();
    scheduleSave();
    toast(anyOff ? 'Bold on' : 'Bold off');
    return;
  }
  if (state.selectedId) {
    pushUndo();
    const node = state.doc.nodes.find(n => n.id === state.selectedId);
    if (!node) return;
    setBold(state.selectedId, !node.bold);
    render();
    scheduleSave();
  }
}

// Build the descendant set for a given id within state.doc
function descendantSet(id) {
  const set = new Set([id]);
  let changed = true;
  while (changed) {
    changed = false;
    state.doc.nodes.forEach(n => {
      if (n.parent && set.has(n.parent) && !set.has(n.id)) { set.add(n.id); changed = true; }
    });
  }
  return set;
}

// Delete a single node + its descendants. In big-picture, mirror the deletion to source maps.
function deleteNodeImmediate(id) {
  const isCenter = state.bigPicture ? id.endsWith('__center') : id === 'center';
  if (isCenter) { toast('Cannot delete center'); return; }
  pushUndo();
  const set = descendantSet(id);
  if (state.bigPicture) {
    const byMap = {};
    state.doc.nodes.forEach(n => {
      if (set.has(n.id) && n._sourceMapId) {
        (byMap[n._sourceMapId] = byMap[n._sourceMapId] || new Set()).add(n._sourceId);
      }
    });
    Object.entries(byMap).forEach(([mapId, srcIds]) => {
      const m = state.maps.find(x => x.id === mapId);
      if (m) m.nodes = m.nodes.filter(n => !srcIds.has(n.id));
    });
    state.doc.nodes = state.doc.nodes.filter(n => !set.has(n.id));
  } else {
    state.doc.nodes = state.doc.nodes.filter(n => !set.has(n.id));
  }
  state.selectedId = null;
  render();
  scheduleSave();
}

document.getElementById('floatPriority').onclick = (e) => {

document.getElementById('floatDate').onclick = async (e) => {
  e.stopPropagation();
  if (!state.selectedId) return;

  if (!node) return;
  const r = await openDateSheet({
    title: 'Due date',
    sub: node.label,
    value: node.dueDate || ''
  });
  if (!r) return;
  pushUndo();
  const { src } = resolveNodeAndSource(node);
  if (r.action === 'clear') {
    delete node.dueDate;
    if (src && src !== node) delete src.dueDate;
    toast('Date cleared');
  } else if (r.action === 'save') {
    node.dueDate = r.value;
    if (src && src !== node) src.dueDate = r.value;
    toast('Due ' + formatDueDate(r.value));
  }
  render();
  scheduleSave();
};

document.getElementById('floatDone').onclick = (e) => {
  e.stopPropagation();
  if (!state.selectedId) return;
  const node = state.doc.nodes.find(n => n.id === state.selectedId);
  if (!node || node.type !== 'todo') return;
  pushUndo();
  const { src } = resolveNodeAndSource(node);
  node.done = !node.done;
  if (src && src !== node) src.done = node.done;
  toast(node.done ? 'Marked done' : 'Marked active');

  scheduleSave();
};

document.getElementById('floatDelete').onclick = (e) => {
  e.stopPropagation();
  if (!state.selectedId) return;
  const node = state.doc.nodes.find(n => n.id === state.selectedId);
  if (!node) return;
  // For to-dos and family-anchors: instant delete (cheap, undo via re-add)
  // For projects: require confirm because they have children
  const childCount = descendantSet(state.selectedId).size - 1;
  if (node.type === 'todo' || (node.type === 'family' && childCount === 0)) {
    deleteNodeImmediate(state.selectedId);
    toast('Deleted');
  } else {
    // Use the existing confirm flow
    document.getElementById('deleteNode').click();
  }
};

// Multi-select bar handlers
document.getElementById('multiPriority').onclick = () => {
  if (!state.multiSelected) return;
  pushUndo();
  // If any are not-priority, turn ALL on. Otherwise turn all off.
  const ids = Array.from(state.multiSelected);
  const anyOff = ids.some(id => {
    const n = state.doc.nodes.find(x => x.id === id);
    return n && !n.priority;
  });
  ids.forEach(id => {
    const n = state.doc.nodes.find(x => x.id === id);
    if (!n) return;
    const { src } = resolveNodeAndSource(n);
    n.priority = anyOff ? true : false;
    if (src && src !== n) src.priority = n.priority;
  });
  render();
  scheduleSave();
  toast(anyOff ? 'Priority on' : 'Priority off');
};

document.getElementById('multiDelete').onclick = () => {
  if (!state.multiSelected) return;
  const ids = Array.from(state.multiSelected);
  // Filter out centers
  const deletable = ids.filter(id => {
    const isCenter = state.bigPicture ? id.endsWith('__center') : id === 'center';
    return !isCenter;
  });
  if (deletable.length === 0) {
    toast('Nothing to delete');
    return;
  }
  pushUndo();
  // Compute combined descendant set across all selected
  const combined = new Set();
  deletable.forEach(id => descendantSet(id).forEach(d => combined.add(d)));
  if (state.bigPicture) {
    const byMap = {};
    state.doc.nodes.forEach(n => {
      if (combined.has(n.id) && n._sourceMapId) {
        (byMap[n._sourceMapId] = byMap[n._sourceMapId] || new Set()).add(n._sourceId);
      }
    });
    Object.entries(byMap).forEach(([mapId, srcIds]) => {
      const m = state.maps.find(x => x.id === mapId);
      if (m) m.nodes = m.nodes.filter(n => !srcIds.has(n.id));
    });
    state.doc.nodes = state.doc.nodes.filter(n => !combined.has(n.id));
  } else {
    state.doc.nodes = state.doc.nodes.filter(n => !combined.has(n.id));
  }
  toast(`Deleted ${combined.size}`);
  state.multiSelected = null;
  state.selectedId = null;
  render();
  scheduleSave();
};

document.getElementById('multiClear').onclick = () => {

};

document.getElementById('focusMap').onclick = () => {
  if (!state.bigPicture && !state.lockedIn) return;
  if (!state.selectedId) return;
  const synth = state.doc.nodes.find(n => n.id === state.selectedId);
  if (!synth || !synth._sourceMapId) return;
  const targetSourceId = synth._sourceId;
  switchMap(synth._sourceMapId);
  // After switching, try to select and center on the original node
  state.selectedId = targetSourceId;
  const target = state.doc.nodes.find(n => n.id === targetSourceId);
  if (target) {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    state.zoom = 1;
    state.panX = w / 2 - target.x;
    state.panY = h / 2 - target.y;
    applyTransform();
  }
  render();
};

document.getElementById('deleteNode').onclick = async () => {
  if (!state.selectedId) return;

    ? state.selectedId.endsWith('__center')
    : state.selectedId === 'center';
  if (isCenterSel) return;

  const node = state.doc.nodes.find(n => n.id === state.selectedId);
  // Build delete-set in the active doc (real or synthetic)
  const set = new Set([state.selectedId]);
  let changed = true;
  while (changed) {
    changed = false;
    state.doc.nodes.forEach(n => {
      if (n.parent && set.has(n.parent) && !set.has(n.id)) { set.add(n.id); changed = true; }
    });
  }
  const childCount = set.size - 1;
  const sub = childCount > 0 ? `removes ${childCount} attached node${childCount > 1 ? 's' : ''} too` : 'this is permanent';
  const r = await openSheet({ title: `Delete ${node.label}?`, sub, placeholder: 'type DELETE to confirm', primary: 'Delete' });
  if (r && r.value && r.value.toUpperCase() === 'DELETE') {
    pushUndo();
    if (state.bigPicture) {
      // Delete from each affected source map
      const byMap = {};
      state.doc.nodes.forEach(n => {
        if (set.has(n.id) && n._sourceMapId) {
          (byMap[n._sourceMapId] = byMap[n._sourceMapId] || new Set()).add(n._sourceId);
        }
      });
      Object.entries(byMap).forEach(([mapId, srcIds]) => {
        const m = state.maps.find(x => x.id === mapId);
        if (m) m.nodes = m.nodes.filter(n => !srcIds.has(n.id));
      });
      state.doc.nodes = state.doc.nodes.filter(n => !set.has(n.id));
    } else {
      state.doc.nodes = state.doc.nodes.filter(n => !set.has(n.id));
    }
    state.selectedId = null;
    render();
    scheduleSave();
    toast('Deleted');
  } else if (r) {
    toast('Type DELETE to confirm');

};
