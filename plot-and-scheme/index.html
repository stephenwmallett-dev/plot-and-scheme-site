// Map switcher sheet — list of all maps + actions for current map
function openMapSwitcher() {
  return new Promise((resolve) => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';

    // Default to grid view ("all in one place")
    let view = 'grid';

    function dotColor(m) {
      return m.color === 'none' ? '#0a0a0a' : (COLORS[m.color]?.fill || '#0a0a0a');
    }

    function renderListHtml() {
      const bpActive = state.bigPicture;
      const liActive = state.lockedIn;
      // Count locked-in items for the label
      const lockedCount = state.maps.reduce((sum, m) =>
        sum + m.nodes.filter(n => n.priority || n.dueDate).length, 0);
      const bpItem = `
        <button type="button" class="map-item bp-item${bpActive ? ' active' : ''}" data-map-id="${ALL_MAP_ID}">
          <span class="map-dot bp-dot"></span>
          <span class="map-item-name">Big picture <span class="bp-sub">all maps</span></span>
          ${bpActive ? '<span class="map-item-current">current</span>' : ''}
        </button>
      `;
      const liItem = `
        <button type="button" class="map-item li-item${liActive ? ' active' : ''}" data-map-id="${LOCKED_MAP_ID}">
          <span class="map-dot li-dot"></span>
          <span class="map-item-name">Locked In <span class="bp-sub">${lockedCount} priority · due</span></span>
          ${liActive ? '<span class="map-item-current">current</span>' : ''}
        </button>
      `;
      const items = state.maps.map(m => {
        const isActive = !state.bigPicture && !state.lockedIn && m.id === state.doc.id;
        return `
          <button type="button" class="map-item${isActive ? ' active' : ''}" data-map-id="${escapeHtml(m.id)}">
            <span class="map-dot" style="background: ${dotColor(m)};"></span>
            <span class="map-item-name">${escapeHtml(m.name)}</span>
            ${isActive ? '<span class="map-item-current">current</span>' : ''}
          </button>
        `;
      }).join('');
      return bpItem + liItem + items;
    }

    function renderGridHtml() {
      // Top row: Big Picture + Locked In, then the five real maps
      const totalNodes = state.maps.reduce((sum, m) => sum + m.nodes.length, 0);
      const lockedCount = state.maps.reduce((sum, m) =>
        sum + m.nodes.filter(n => n.priority || n.dueDate).length, 0);
      const dotsForBP = state.maps.map(m => {
        const c = m.color === 'none' ? '#0a0a0a' : (COLORS[m.color]?.fill || '#0a0a0a');
        return `<span class="bp-mini-dot" style="background: ${c};"></span>`;
      }).join('');
      const bpActive = state.bigPicture;
      const liActive = state.lockedIn;
      const bpCard = `
        <button type="button" class="map-card big-picture-card${bpActive ? ' active' : ''}" data-map-id="${ALL_MAP_ID}">
          <div class="map-card-thumb bp-thumb">
            <div class="bp-mini-dots">${dotsForBP}</div>
            <div class="bp-thumb-label">Big picture</div>
          </div>
          <div class="map-card-meta">
            <span class="map-dot bp-dot"></span>
            <span class="map-card-name">All maps</span>
          </div>
          <div class="map-card-count">${totalNodes} nodes${bpActive ? ' · current' : ''}</div>
        </button>
      `;
      const liCard = `
        <button type="button" class="map-card locked-in-card${liActive ? ' active' : ''}" data-map-id="${LOCKED_MAP_ID}">
          <div class="map-card-thumb li-thumb">
            <div class="li-thumb-icon">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#c73c2e" stroke-width="1.5" stroke-linejoin="round">
                <polygon points="11,2 13.5,8 20,8 14.7,12 16.7,18.5 11,14.8 5.3,18.5 7.3,12 2,8 8.5,8"/>
              </svg>
            </div>
            <div class="li-thumb-label">Locked In</div>
          </div>
          <div class="map-card-meta">
            <span class="map-dot li-dot"></span>
            <span class="map-card-name">Priority &amp; due</span>
          </div>
          <div class="map-card-count">${lockedCount} item${lockedCount === 1 ? '' : 's'}${liActive ? ' · current' : ''}</div>
        </button>
      `;

      const mapCards = state.maps.map(m => {
        const isActive = !state.bigPicture && !state.lockedIn && m.id === state.doc.id;
        const isAnchorThumb = !m.color || m.color === 'none';
        const c = COLORS[m.color] || null;
        const thumb = renderThumbSVG(m, isAnchorThumb, c);
        const childCount = m.nodes.length - 1;
        return `
          <button type="button" class="map-card${isActive ? ' active' : ''}" data-map-id="${escapeHtml(m.id)}">
            <div class="map-card-thumb">${thumb}</div>
            <div class="map-card-meta">
              <span class="map-dot" style="background: ${dotColor(m)};"></span>
              <span class="map-card-name">${escapeHtml(m.name)}</span>
            </div>
            <div class="map-card-count">${childCount} node${childCount === 1 ? '' : 's'}${isActive ? ' · current' : ''}</div>
          </button>
        `;
      }).join('');

      return bpCard + liCard + mapCards;
    }

    function refresh() {
      const body = bg.querySelector('.switcher-body');
      if (view === 'list') {
        body.className = 'switcher-body map-list';
        body.innerHTML = renderListHtml();
        body.querySelectorAll('.map-item').forEach(wireSwitch);
      } else {
        body.className = 'switcher-body map-grid';
        body.innerHTML = renderGridHtml();
        body.querySelectorAll('.map-card').forEach(wireSwitch);
      }
      bg.querySelectorAll('.view-tab').forEach(t => {
        t.classList.toggle('active', t.getAttribute('data-view') === view);
      });
    }

    function wireSwitch(el) {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-map-id');
        if (id !== state.doc.id) switchMap(id);
        close({ action: 'switch', id });
      });
    }

    const showCurrentActions = !state.bigPicture && !state.lockedIn;
    bg.innerHTML = `
      <div class="sheet sheet-tall" role="dialog">
        <div class="sheet-head">
          <div>
            <h3>Switch map</h3>
            <div class="sub">${state.bigPicture ? 'big picture · pick a map to focus' : (state.lockedIn ? 'locked in · pick a map to focus' : 'seven views · pick one')}</div>
          </div>
          <div class="view-tabs">
            <button type="button" class="view-tab" data-view="grid" aria-label="Grid view">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="1.5" y="1.5" width="5" height="5"/>
                <rect x="9.5" y="1.5" width="5" height="5"/>
                <rect x="1.5" y="9.5" width="5" height="5"/>
                <rect x="9.5" y="9.5" width="5" height="5"/>
              </svg>
            </button>
            <button type="button" class="view-tab" data-view="list" aria-label="List view">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <line x1="2" y1="4" x2="14" y2="4"/>
                <line x1="2" y1="8" x2="14" y2="8"/>
                <line x1="2" y1="12" x2="14" y2="12"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="switcher-body"></div>
        <div class="sheet-actions sheet-actions-narrow">
          <button data-action="cancel">Done</button>
          <button data-action="new">+ New map</button>
          <button data-action="export">Export backup</button>
          <button data-action="import">Import backup</button>
          ${showCurrentActions ? '<button data-action="recolor">Recolor</button>' : ''}
          ${showCurrentActions ? '<button data-action="rename">Rename</button>' : ''}
        </div>
        <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;" />
      </div>
    `;
    document.body.appendChild(bg);
    refresh();

    function close(r) { bg.remove(); resolve(r); }
    bg.addEventListener('click', e => { if (e.target === bg) close(null); });

    bg.querySelectorAll('.view-tab').forEach(t => {
      t.addEventListener('click', () => {
        view = t.getAttribute('data-view');
        refresh();
      });
    });

    bg.querySelector('[data-action="cancel"]').addEventListener('click', () => close(null));

    const renameBtn = bg.querySelector('[data-action="rename"]');
    if (renameBtn) renameBtn.addEventListener('click', async () => {
      close(null);
      const r = await openSheet({ title: 'Rename map', sub: 'this whiteboard', value: state.doc.name, placeholder: 'Map name', primary: 'Save' });
      if (r) {
        pushUndo();
        state.doc.name = r.value;
        document.getElementById('mapName').textContent = r.value;
        scheduleSave();
      }
    });

    const recolorBtn = bg.querySelector('[data-action="recolor"]');
    if (recolorBtn) recolorBtn.addEventListener('click', async () => {
      close(null);
      const r = await openSheet({
        title: 'Recolor map',
        sub: 'pick a hue · neutral = anchor (black)',
        value: state.doc.name,
        placeholder: 'Map name',
        primary: 'Save',
        swatches: { current: state.doc.color || 'none' }
      });
      if (r) {
        pushUndo();
        if (r.value && r.value !== state.doc.name) {
          state.doc.name = r.value;
          document.getElementById('mapName').textContent = r.value;
        }
        if (r.color !== undefined) {
          state.doc.color = r.color;
        }
        render();
        scheduleSave();
      }
    });

    const exportBtn = bg.querySelector('[data-action="export"]');
    if (exportBtn) exportBtn.addEventListener('click', () => {
      exportBackup();
    });

    const newBtn = bg.querySelector('[data-action="new"]');
    if (newBtn) newBtn.addEventListener('click', async () => {
      close(null);
      const r = await openSheet({
        title: 'New map',
        sub: 'name it · pick a hue · neutral = anchor (black)',
        placeholder: 'e.g. Nancy Mace, Q3 Slate, House Reno',
        primary: 'Create',
        swatches: { current: 'none' }
      });
      if (!r || !r.value) return;
      await createNewMap(r.value, r.color || 'none');
    });

    const importBtn = bg.querySelector('[data-action="import"]');
    const fileIn = bg.querySelector('#importFileInput');
    if (importBtn && fileIn) {
      importBtn.addEventListener('click', () => fileIn.click());
      fileIn.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          await importBackup(data);
          close({ action: 'imported' });
          toast('Backup restored');
        } catch (err) {
          console.error(err);
          toast('Import failed — bad file');
        }
      });
    }
  });
}

// Export current state.maps to a JSON download
function exportBackup() {
  const data = state.maps.map(m => ({
    id: m.id,
    name: m.name,
    color: m.color,
    updatedAt: m.updatedAt,
    nodes: m.nodes.map(n => ({ ...n }))
  }));
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `plot-and-scheme-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  // Record the backup time so we can stop nagging
  try { localStorage.setItem('ps-last-export', String(Date.now())); } catch {}
  toast('Backup downloaded');
}

// Import a JSON backup, replacing all maps. Pushes an undo entry first so a bad
// import can be reversed with Cmd-Z.
async function importBackup(data) {
  if (!Array.isArray(data)) throw new Error('Expected an array of maps');
  // Validate each map has the minimum required fields
  data.forEach((m, i) => {
    if (!m.id) throw new Error('Map at index ' + i + ' missing id');
    if (!Array.isArray(m.nodes)) throw new Error('Map ' + m.id + ' missing nodes');
  });

  pushUndo();

  // Replace state.maps with deep copies of imported data
  state.maps = data.map(m => ({
    id: m.id,
    name: m.name || 'Untitled',
    color: m.color || 'none',
    updatedAt: m.updatedAt || Date.now(),
    nodes: m.nodes.map(n => ({ ...n }))
  }));

  // Persist every map immediately
  for (const m of state.maps) await saveMap(m);

  // Rebind state.doc — keep current map id if it still exists, otherwise first
  if (state.bigPicture) {
    state.doc = buildBigPictureDoc();
  } else {
    const activeId = state.doc?.id;
    state.doc = state.maps.find(m => m.id === activeId) || state.maps[0];
    document.getElementById('mapName').textContent = state.doc.name;
  }
  state.selectedId = null;
  state.multiSelected = null;
  render();
  if (!state.bigPicture) centerOnCenter();
}

// Create a new map with a fresh center node and switch into it.
// The id is generated from timestamp+random so it never collides with existing maps
// (including reserved ones like __all__ and __locked__).
async function createNewMap(name, color) {
  pushUndo();
  const id = 'map_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  const map = {
    id,
    name: name.trim(),
    color: color || 'none',
    updatedAt: Date.now(),
    nodes: [
      { id: 'center', label: name.trim(), type: 'center', x: 800, y: 600 }
    ]
  };
  state.maps.push(map);
  await saveMap(map);
  // Switch straight into the new map so user can start dumping nodes immediately
  switchMap(id);
  toast('Created ' + name.trim());
}

// Render a small SVG snapshot of a map for the grid view.
// Returns SVG markup string. Uses the map's own node positions, scaled to fit.
function renderThumbSVG(m, isAnchor, mc) {
  const TW = 130, TH = 90; // thumb canvas size
  const PAD = 8;
  // Compute bounding box around nodes
  if (!m.nodes || m.nodes.length === 0) {
    return `<svg viewBox="0 0 ${TW} ${TH}" width="${TW}" height="${TH}"></svg>`;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  m.nodes.forEach(n => {
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  });
  // Add some padding so nodes aren't on the edge
  const bw = Math.max(200, maxX - minX);
  const bh = Math.max(200, maxY - minY);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  // Fit ratio
  const scale = Math.min((TW - PAD * 2) / bw, (TH - PAD * 2) / bh);

  function project(x, y) {
    return {
      x: TW / 2 + (x - cx) * scale,
      y: TH / 2 + (y - cy) * scale
    };
  }

  const byId = Object.fromEntries(m.nodes.map(n => [n.id, n]));
  let lines = '';
  m.nodes.forEach(n => {
    if (!n.parent) return;
    const p = byId[n.parent];
    if (!p) return;
    const a = project(p.x, p.y), b = project(n.x, n.y);
    const stroke = isAnchor ? 'rgba(10,10,10,0.45)' : (mc ? mc.todoBorder : 'rgba(10,10,10,0.3)');
    const op = n.type === 'todo' ? 0.5 : 0.85;
    lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="0.7" stroke-opacity="${op}"/>`;
  });

  let dots = '';
  m.nodes.forEach(n => {
    const p = project(n.x, n.y);
    let r, fill;
    if (n.type === 'center') {
      r = 6;
      fill = isAnchor ? '#0a0a0a' : (mc ? mc.fill : '#0a0a0a');
    } else if (n.type === 'family') {
      r = 4;
      fill = '#0a0a0a';
    } else if (n.type === 'project') {
      r = 4;
      fill = isAnchor ? '#0a0a0a' : (mc ? mc.fill : '#0a0a0a');
    } else {
      r = 2.5;
      fill = isAnchor ? '#0a0a0a' : (mc ? mc.todoBorder : '#6b6b66');
      if (n.done) fill = '#aeaea6';
    }
    dots += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}"/>`;
  });

  return `<svg viewBox="0 0 ${TW} ${TH}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${lines}${dots}</svg>`;
}

function switchMap(id) {
  if (id === ALL_MAP_ID) {
    state.bigPicture = true;
    state.lockedIn = false;
    state.doc = buildBigPictureDoc();
    state.selectedId = null;
    document.getElementById('mapName').textContent = 'Big picture';
    document.body.classList.add('big-picture-mode');
    document.body.classList.remove('locked-in-mode');
    render();
    fitAllToView();
    return;
  }
  if (id === LOCKED_MAP_ID) {
    state.bigPicture = false;
    state.lockedIn = true;
    state.doc = buildLockedInDoc();
    state.selectedId = null;
    document.getElementById('mapName').textContent = 'Locked In';
    document.body.classList.remove('big-picture-mode');
    document.body.classList.add('locked-in-mode');
    render();
    fitLockedInToView();
    return;
  }
  const next = state.maps.find(m => m.id === id);
  if (!next) return;
  state.bigPicture = false;
  state.lockedIn = false;
  state.doc = next;
  state.selectedId = null;
  document.getElementById('mapName').textContent = next.name;
  document.body.classList.remove('big-picture-mode');
  document.body.classList.remove('locked-in-mode');
  render();
  centerOnCenter();
}

// Build a virtual document that aggregates every node from every real map.
// Each map gets its own "neighborhood" on a big shared canvas.
function buildBigPictureDoc() {
  // Layout: arrange maps in a 3-column grid with generous spacing.
  const COLS = 3;
  const CLUSTER_W = 1800;
  const CLUSTER_H = 1400;
  const offsets = {};
  const sourceCenters = {};
  state.maps.forEach((m, i) => {
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    offsets[m.id] = {
      dx: col * CLUSTER_W,
      dy: row * CLUSTER_H
    };
    const center = m.nodes.find(n => n.id === 'center');
    sourceCenters[m.id] = center ? { x: center.x, y: center.y } : { x: 800, y: 600 };
  });

  const allNodes = [];
  state.maps.forEach(m => {
    const off = offsets[m.id];
    const sc = sourceCenters[m.id];
    m.nodes.forEach(src => {
      // Synthetic id is mapId__nodeId so it doesn't collide across maps.
      const sid = m.id + '__' + src.id;
      const synth = {
        id: sid,
        label: src.label,
        type: src.type,
        x: (src.x - sc.x) + off.dx,
        y: (src.y - sc.y) + off.dy,
        parent: src.parent ? (m.id + '__' + src.parent) : undefined,
        done: src.done,
        color: src.color,  // carry per-node override into big picture
        _sourceMapId: m.id,
        _sourceId: src.id,
        _mapColor: m.color
      };
      allNodes.push(synth);
    });
  });

  return {
    id: ALL_MAP_ID,
    name: 'Big picture',
    color: 'none',
    nodes: allNodes,
    _isBigPicture: true,
    _offsets: offsets,
    _sourceCenters: sourceCenters
  };
}

// When a synthetic node is dragged, write the change back to the source node.
function syncBigPictureNodePosition(synthNode) {
  const map = state.maps.find(m => m.id === synthNode._sourceMapId);
  if (!map) return;
  const src = map.nodes.find(n => n.id === synthNode._sourceId);
  if (!src) return;
  const off = state.doc._offsets[synthNode._sourceMapId];
  const sc = state.doc._sourceCenters[synthNode._sourceMapId];
  src.x = (synthNode.x - off.dx) + sc.x;
  src.y = (synthNode.y - off.dy) + sc.y;
}

// Fit the whole big-picture doc into view.
function fitAllToView() {
  if (!state.doc || state.doc.nodes.length === 0) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  state.doc.nodes.forEach(n => {
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  });
  const PAD = 200;
  const bw = maxX - minX + PAD * 2;
  const bh = maxY - minY + PAD * 2;
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  state.zoom = Math.min(w / bw, h / bh, 1);
  state.panX = w / 2 - cx * state.zoom;
  state.panY = h / 2 - cy * state.zoom;
  applyTransform();
}

// Build the Locked In synthetic doc — vertical stack of all priority/dated nodes.
// Sorted: dated nodes by deadline ascending, then priority-only nodes after.
function buildLockedInDoc() {
  // Gather every node that has priority or a due date, with its source map context
  const items = [];
  state.maps.forEach(m => {
    m.nodes.forEach(src => {
      if (src.priority || src.dueDate) {
        items.push({
          src,
          map: m,
          mapColor: m.color
        });
      }
    });
  });

  // Sort: dated first by ascending deadline, then priority-only items
  items.sort((a, b) => {
    const ad = a.src.dueDate ? parseDueDate(a.src.dueDate)?.getTime() : null;
    const bd = b.src.dueDate ? parseDueDate(b.src.dueDate)?.getTime() : null;
    if (ad !== null && bd !== null) return ad - bd;
    if (ad !== null && bd === null) return -1; // dated comes before priority-only
    if (ad === null && bd !== null) return 1;
    // Both priority-only — group by source map for stability
    if (a.map.id !== b.map.id) return a.map.id.localeCompare(b.map.id);
    return 0;
  });

  // Lay out vertically. Generous spacing so micro nodes have room below each.
  const COL_X = 800;
  const TOP_Y = 200;
  const ROW_GAP = 160; // includes room for the micro node when present
  const allNodes = [];
  items.forEach((it, i) => {
    const sid = it.map.id + '__' + it.src.id;
    allNodes.push({
      id: sid,
      label: it.src.label,
      type: it.src.type,
      x: COL_X,
      y: TOP_Y + i * ROW_GAP,
      // No parent in Locked In — these are flat list items
      parent: undefined,
      done: it.src.done,
      priority: it.src.priority,
      dueDate: it.src.dueDate,
      bold: it.src.bold,
      color: it.src.color,
      _sourceMapId: it.map.id,
      _sourceId: it.src.id,
      _mapColor: it.mapColor,
      _mapName: it.map.name
    });
  });

  return {
    id: LOCKED_MAP_ID,
    name: 'Locked In',
    color: 'none',
    nodes: allNodes,
    _isLockedIn: true,
    _itemCount: items.length
  };
}

// Fit Locked In into view — center horizontally, position scrolled to top
function fitLockedInToView() {
  if (!state.doc || state.doc.nodes.length === 0) {
    // Even empty, position somewhere reasonable
    const w = wrap.clientWidth;
    state.zoom = 1;
    state.panX = w / 2 - 800;
    state.panY = 100;
    applyTransform();
    return;
  }
  const w = wrap.clientWidth;
  state.zoom = 1;
  state.panX = w / 2 - 800;
  state.panY = 80; // start near the top so first item is visible
  applyTransform();
}

// In big-picture mode, the source node lookup for any synthetic node id.
function sourceNodeFor(synthId) {
  const synth = state.doc.nodes.find(n => n.id === synthId);
  if (!synth || !synth._sourceMapId) return null;
  const map = state.maps.find(m => m.id === synth._sourceMapId);
  if (!map) return null;
  const src = map.nodes.find(n => n.id === synth._sourceId);
  return src ? { synth, map, src } : null;
}

function centerOnCenter() {
  const c = state.doc.nodes.find(n => n.id === 'center');
  if (!c) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  state.zoom = Math.min(1, Math.min(w / 1600, h / 1200) * 1.4);
  state.panX = w / 2 - c.x * state.zoom;
  state.panY = h / 2 - c.y * state.zoom;
  applyTransform();
}

window.addEventListener('resize', () => applyTransform());

// Live countdown ticker — updates all visible countdown texts in place without re-rendering
function tickCountdowns() {
  const nodes = document.querySelectorAll('text[data-countdown-for]');
  if (nodes.length === 0) return;
  nodes.forEach(el => {
    const id = el.getAttribute('data-countdown-for');
    const node = state.doc?.nodes.find(n => n.id === id);
    if (!node || !node.dueDate) return;
    el.textContent = formatCountdown(node.dueDate);
  });
}
// Tick every second. Cheap: just text content updates on a small number of nodes.
setInterval(tickCountdowns, 1000);

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  // Don't intercept while user is typing in inputs
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const key = e.key.toLowerCase();

  if (key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
  } else if (key === 'b') {
    e.preventDefault();
    toggleBoldOnSelection();
  } else if (key === '=' || key === '+') {
    // Cmd-+ : zoom canvas in (NOT browser page). '=' is the unshifted key for '+'.
    e.preventDefault();
    zoomAtViewportCenter(1.2);
  } else if (key === '-' || key === '_') {
    // Cmd-- : zoom canvas out
    e.preventDefault();
    zoomAtViewportCenter(1 / 1.2);
  } else if (key === '0') {
    // Cmd-0 : reset / recenter, matching browser muscle memory
    e.preventDefault();
    if (state.bigPicture) fitAllToView();
    else if (state.lockedIn) fitLockedInToView();
    else centerOnCenter();
  }
});

// Zoom the map canvas around the center of the visible viewport.
// Keeps whatever's in the middle of the screen anchored as you zoom.
function zoomAtViewportCenter(factor) {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const mx = w / 2, my = h / 2;
  const newZoom = clamp(state.zoom * factor, MIN_ZOOM, MAX_ZOOM);
  const ratio = newZoom / state.zoom;
  state.panX = mx - (mx - state.panX) * ratio;
  state.panY = my - (my - state.panY) * ratio;
  state.zoom = newZoom;
  applyTransform();
}

// ============================================================
// Boot
// ============================================================
(async function boot() {
  // Ensure we have a passcode before hitting the cloud
  await ensureCloudAccess();

  let existing = [];
  let attempts = 0;
  while (attempts < 3) {
    try {
      existing = await loadAllMaps();
      break;
    } catch (e) {
      if (String(e.message) === 'unauthorized') {
        const p = await promptPassword('Wrong passcode — try again');
        if (!p) break;
        setPass(p);
        attempts++;
        continue;
      }
      // Other errors already fall back to local inside loadAllMapsSynced
      existing = await loadAllMapsLocal();
      break;
    }
  }

  if (existing && existing.length > 0) {
    // Sort to match starter order so menu is stable; unknown ones go last.
    const order = STARTER_MAPS.map(m => m.id);
    state.maps = existing.slice().sort((a, b) => {
      const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  } else {
    state.maps = seedAllMaps();
    for (const m of state.maps) await saveMap(m);
  }
  state.doc = state.maps[0];
  document.getElementById('mapName').textContent = state.doc.name;
  render();
  requestAnimationFrame(centerOnCenter);

  // Gentle backup nudge — if there's real work and it's been 3+ days since last export
  setTimeout(() => {
    try {
      const totalNodes = state.maps.reduce((s, m) => s + m.nodes.length, 0);
      const centersOnly = state.maps.length; // 1 center per map = "empty"
      if (totalNodes <= centersOnly) return; // nothing worth backing up yet
      const last = parseInt(localStorage.getItem('ps-last-export') || '0', 10);
      const days = (Date.now() - last) / (1000 * 60 * 60 * 24);
      if (days >= 3) {
        showBackupReminder(last === 0);
      }
    } catch {}
  }, 2500);
})();

// A non-blocking reminder bar suggesting an export. Dismissable.
function showBackupReminder(neverBackedUp) {
  if (document.getElementById('backupReminder')) return;
  const bar = document.createElement('div');
  bar.id = 'backupReminder';
  bar.style.cssText = `
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    background: var(--ink); color: var(--paper);
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    letter-spacing: 0.04em; padding: 10px 12px 10px 16px;
    border-radius: 4px; z-index: 300; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(10,10,10,0.2); max-width: calc(100% - 32px);
  `;
  const msg = neverBackedUp
    ? 'Back up your work to be safe'
    : "It's been a few days — back up your work";
  bar.innerHTML = `
    <span>${msg}</span>
    <button id="backupNow" style="background:var(--paper);color:var(--ink);border:none;border-radius:2px;padding:6px 12px;font-family:inherit;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;">Export</button>
    <button id="backupDismiss" style="background:transparent;color:var(--ink-faint);border:none;font-size:16px;cursor:pointer;padding:0 4px;line-height:1;">×</button>
  `;
  document.body.appendChild(bar);
  document.getElementById('backupNow').onclick = () => { exportBackup(); bar.remove(); };
  document.getElementById('backupDismiss').onclick = () => {
    // Snooze for a day by stamping a recent-ish time
    try { localStorage.setItem('ps-last-export', String(Date.now() - 2 * 24 * 60 * 60 * 1000)); } catch {}
    bar.remove();
  };
}
